<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>NET Tram Map | Hawkes House</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    
    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    
    a.back-link:hover { color: var(--accent); }
    
    .header {
      margin-bottom: 1.5rem;
    }
    
    .header h1 {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: -0.025em;
    }
    
    .header h1 span { color: var(--accent); }
    .header p { color: var(--text-muted); margin-top: 0.25rem; }

    .map-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 550px;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      flex-grow: 1;
      border-radius: 8px;
      background-color: #0b1329;
    }

    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1.1rem;
      transition: opacity 0.5s;
    }

    /* CSS Dark Mode Filter for OpenStreetMap Tiles */
    .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    /* Custom Popup Theme Styling */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background-color: var(--card-bg) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .leaflet-popup-content-wrapper {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Tram <span>Network</span></h1>
      <p>Interactive Nottingham Express Transit (NET) Map</p>
    </div>

    <div class="map-card">
      <div id="loading-overlay">Syncing live network stops & tracks...</div>
      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // Initialize map centered around the NET network
    const map = L.map('map', {
      zoomControl: false
    }).setView([52.955, -1.185], 12);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Free API-less OpenStreetMap tiles (dark-themed via CSS filter)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Full Schedule Mapping from the Network Map PDF
    const lineMapping = {
      // Green Line North
      "Hucknall": "Green Line",
      "Butler's Hill": "Green Line",
      "Moor Bridge": "Green Line",
      "Bulwell Forest": "Green Line",
      "Bulwell": "Green Line",
      
      // Purple Line North
      "Phoenix Park": "Purple Line",
      "Cinderhill": "Purple Line",
      
      // Shared Central Section
      "Highbury Vale": "Green & Purple Lines",
      "David Lane": "Green & Purple Lines",
      "Basford": "Green & Purple Lines",
      "Wilkinson Street": "Green & Purple Lines",
      "Radford Road": "Green & Purple Lines",
      "Hyson Green Market": "Green & Purple Lines",
      "Shipstone Street": "Green & Purple Lines",
      "Beaconsfield Street": "Green & Purple Lines",
      "Noel Street": "Green & Purple Lines",
      "The Forest": "Green & Purple Lines",
      "High School": "Green & Purple Lines",
      "Nottingham Trent University": "Green & Purple Lines",
      "Royal Centre": "Green & Purple Lines",
      "Old Market Square": "Green & Purple Lines",
      "Lace Market": "Green & Purple Lines",
      "Nottingham Station": "Green & Purple Lines",
      
      // Green Line South
      "Meadows Way West": "Green Line",
      "NG2": "Green Line",
      "Gregory Street": "Green Line",
      "Queens Medical Centre": "Green Line",
      "University of Nottingham": "Green Line",
      "University Boulevard": "Green Line",
      "Middle Street": "Green Line",
      "Beeston Centre": "Green Line",
      "Chilwell Road": "Green Line",
      "High Road - Central College": "Green Line",
      "Cator Lane": "Green Line",
      "Bramcote Lane": "Green Line",
      "Eskdale Drive": "Green Line",
      "Inham Road": "Green Line",
      "Toton Lane": "Green Line",
      
      // Purple Line South
      "Queens Walk": "Purple Line",
      "Meadows Embankment": "Purple Line",
      "Wilford Village": "Purple Line",
      "Wilford Lane": "Purple Line",
      "Compton Acres": "Purple Line",
      "Ruddington Lane": "Purple Line",
      "Southchurch Drive": "Purple Line",
      "Rivergreen": "Purple Line",
      "Clifton Centre": "Purple Line",
      "Holy Trinity": "Purple Line",
      "Summerwood Lane": "Purple Line",
      "Clifton South": "Purple Line"
    };

    // Fetch ALL route layout lines AND tram stops via Overpass API dynamically
    async function loadTramNetwork() {
      try {
        const query = `
          [out:json];
          (
            relation["route"="tram"]["operator"="Nottingham Express Transit"];
            node["railway"="tram_stop"](52.88,-1.26,53.04,-1.13);
          );
          out body;
          >;
          out skel qt;
        `;
        const url = `https://overpass-api.de/api/interpreter?data=` + encodeURIComponent(query);
        
        const response = await fetch(url);
        const data = await response.json();
        
        const nodes = {};
        
        // Pass 1: Collect nodes and draw every station marker
        data.elements.forEach(el => {
          if (el.type === 'node') {
            nodes[el.id] = [el.lat, el.lon]; // Save coordinates for track drawing
            
            // Plot Tram Stops
            if (el.tags && el.tags.railway === 'tram_stop') {
              let rawName = el.tags.name || "Unknown Stop";
              
              // Normalize names to match our schedule dictionary
              let cleanName = rawName.replace(" Tram Stop", "").trim();
              if (cleanName === "QMC") cleanName = "Queens Medical Centre";
              if (cleanName.includes("High Road")) cleanName = "High Road - Central College";
              
              let lineStr = lineMapping[cleanName] || "NET Tram Stop";
              
              // Assign colors based on schedule
              let dotColor = "#38bdf8"; 
              if (lineStr.includes("Green")) dotColor = "#22c55e"; 
              if (lineStr.includes("Purple")) dotColor = "#a855f7"; 
              if (lineStr.includes("Green & Purple")) dotColor = "#f8fafc"; 
              
              const marker = L.circleMarker([el.lat, el.lon], {
                radius: 6,
                fillColor: dotColor,
                color: "#0f172a",
                weight: 2,
                opacity: 1,
                fillOpacity: 1
              }).addTo(map);

              marker.bindPopup(`
                <div style="font-family: inherit;">
                  <strong style="font-size: 1.05rem; color: ${dotColor === '#f8fafc' ? '#38bdf8' : dotColor};">${cleanName}</strong><br>
                  <span style="font-size: 0.85rem; color: #94a3b8;">${lineStr}</span>
                </div>
              `);
            }
          }
        });

        // Pass 2: Connect the nodes to draw the tracks
        data.elements.forEach(el => {
          if (el.type === 'way' && el.nodes) {
            const wayCoords = el.nodes.map(nodeId => nodes[nodeId]).filter(coord => coord !== undefined);
            if (wayCoords.length > 0) {
              L.polyline(wayCoords, {
                color: '#38bdf8',
                weight: 3,
                opacity: 0.35
              }).addTo(map);
            }
          }
        });

        // Hide loading screen once network is plotted
        document.getElementById('loading-overlay').style.opacity = '0';
        setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 500);

      } catch (err) {
        console.error("Failed to load OSM data:", err);
        document.getElementById('loading-overlay').textContent = "Failed to sync network data.";
      }
    }

    loadTramNetwork();
  </script>

</body>
</html>
