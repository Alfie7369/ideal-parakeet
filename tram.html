<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>NET Tram Map | Hawkes House</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --green-line: #22c55e;
      --purple-line: #a855f7;
    }
    
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    
    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    
    a.back-link:hover { color: var(--accent); }
    
    .header {
      margin-bottom: 1.5rem;
    }
    
    .header h1 {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: -0.025em;
    }
    
    .header h1 span { color: var(--accent); }
    .header p { color: var(--text-muted); margin-top: 0.25rem; }

    .map-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 550px;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      flex-grow: 1;
      border-radius: 8px;
      background-color: #0b1329;
    }

    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1.1rem;
      transition: opacity 0.5s;
    }

    /* CSS Dark Mode Filter for OpenStreetMap Tiles */
    .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    /* Custom Popup Theme Styling */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background-color: var(--card-bg) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0;
    }
    .leaflet-popup-content {
      margin: 0;
      width: 250px !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: var(--text-muted);
      padding: 8px;
    }
    
    /* Schedule Widget Styling */
    .schedule-header {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
    }
    .schedule-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
    }
    .schedule-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 4px 0 0 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .schedule-body {
      padding: 10px 15px 15px 15px;
    }
    .dep-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .dep-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .dep-dest {
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }
    .dep-time {
      color: var(--accent);
      font-weight: bold;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .dep-time.due {
      color: var(--green-line);
      animation: pulse 2s infinite;
    }
    .indicator {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Tram <span>Network</span></h1>
      <p>Interactive Nottingham Express Transit (NET) Map</p>
    </div>

    <div class="map-card">
      <div id="loading-overlay">Syncing live network stops & tracks...</div>
      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // TransportAPI Credentials
    const APP_ID = '1ed6bf42';
    const APP_KEY = 'a7ecd96d0b2585d4cac92e822712f0ae';

    const map = L.map('map', {
      zoomControl: false
    }).setView([52.955, -1.185], 12);

    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    const lineMapping = {
      // Green Line North
      "Hucknall": "Green Line",
      "Butler's Hill": "Green Line",
      "Moor Bridge": "Green Line",
      "Bulwell Forest": "Green Line",
      "Bulwell": "Green Line",
      // Purple Line North
      "Phoenix Park": "Purple Line",
      "Cinderhill": "Purple Line",
      // Shared Central Section
      "Highbury Vale": "Green & Purple Lines",
      "David Lane": "Green & Purple Lines",
      "Basford": "Green & Purple Lines",
      "Wilkinson Street": "Green & Purple Lines",
      "Radford Road": "Green & Purple Lines",
      "Hyson Green Market": "Green & Purple Lines",
      "Shipstone Street": "Green & Purple Lines",
      "Beaconsfield Street": "Green & Purple Lines",
      "Noel Street": "Green & Purple Lines",
      "The Forest": "Green & Purple Lines",
      "High School": "Green & Purple Lines",
      "Nottingham Trent University": "Green & Purple Lines",
      "Royal Centre": "Green & Purple Lines",
      "Old Market Square": "Green & Purple Lines",
      "Lace Market": "Green & Purple Lines",
      "Nottingham Station": "Green & Purple Lines",
      // Green Line South
      "Meadows Way West": "Green Line",
      "NG2": "Green Line",
      "Gregory Street": "Green Line",
      "Queens Medical Centre": "Green Line",
      "University of Nottingham": "Green Line",
      "University Boulevard": "Green Line",
      "Middle Street": "Green Line",
      "Beeston Centre": "Green Line",
      "Chilwell Road": "Green Line",
      "High Road": "Green Line",
      "Cator Lane": "Green Line",
      "Bramcote Lane": "Green Line",
      "Eskdale Drive": "Green Line",
      "Inham Road": "Green Line",
      "Toton Lane": "Green Line",
      // Purple Line South
      "Queens Walk": "Purple Line",
      "Meadows Embankment": "Purple Line",
      "Wilford Village": "Purple Line",
      "Wilford Lane": "Purple Line",
      "Compton Acres": "Purple Line",
      "Ruddington Lane": "Purple Line",
      "Southchurch Drive": "Purple Line",
      "Rivergreen": "Purple Line",
      "Clifton Centre": "Purple Line",
      "Holy Trinity": "Purple Line",
      "Summerwood Lane": "Purple Line",
      "Clifton South": "Purple Line"
    };

    async function loadTramNetwork() {
      try {
        const query = `
          [out:json];
          (
            relation["route"="tram"]["operator"="Nottingham Express Transit"];
            node["railway"="tram_stop"](52.88,-1.26,53.04,-1.13);
          );
          out body;
          >;
          out skel qt;
        `;
        const url = `https://overpass-api.de/api/interpreter?data=` + encodeURIComponent(query);
        
        const response = await fetch(url);
        const data = await response.json();
        
        const nodes = {};
        
        data.elements.forEach(el => {
          if (el.type === 'node') {
            nodes[el.id] = [el.lat, el.lon]; 
            
            if (el.tags && el.tags.railway === 'tram_stop') {
              let rawName = el.tags.name || "Unknown Stop";
              
              let lineStr = "NET Tram Stop";
              let dotColor = "#38bdf8"; 
              let displayTitle = rawName.replace(" Tram Stop", "").replace(" (Platform 1)", "").replace(" (Platform 2)", "").trim();

              for (const [key, val] of Object.entries(lineMapping)) {
                if (rawName.toLowerCase().includes(key.toLowerCase())) {
                  lineStr = val;
                  displayTitle = key; 
                  if (val.includes("Green")) dotColor = "#22c55e"; 
                  if (val.includes("Purple")) dotColor = "#a855f7"; 
                  if (val.includes("Green & Purple")) dotColor = "#f8fafc";
                  break;
                }
              }
              
              const marker = L.circleMarker([el.lat, el.lon], {
                radius: 6,
                fillColor: dotColor,
                color: "#0f172a",
                weight: 2,
                opacity: 1,
                fillOpacity: 1
              }).addTo(map);

              // Setup empty popup to be filled dynamically on click
              marker.bindPopup(`<div style="padding: 20px; text-align: center; color: var(--text-muted);">Establishing secure link...</div>`);
              
              marker.on('popupopen', async (e) => {
                const popup = e.popup;
                try {
                  // 1. Ask TransportAPI for the exact ATCO platform code at these GPS coordinates
                  const placeRes = await fetch(`https://transportapi.com/v3/uk/places.json?lat=${el.lat}&lon=${el.lon}&type=tram_stop&app_id=${APP_ID}&app_key=${APP_KEY}`);
                  const placeData = await placeRes.json();
                  
                  if (!placeData.member || placeData.member.length === 0) {
                    popup.setContent(`<div style="padding: 20px; text-align: center; color: var(--text-muted);">No live telemetry available.</div>`);
                    return;
                  }
                  
                  const atcoCode = placeData.member[0].atcocode;
                  
                  // 2. Fetch the live scheduled departures for that platform
                  const depRes = await fetch(`https://transportapi.com/v3/uk/tram/stop/${atcoCode}/live.json?app_id=${APP_ID}&app_key=${APP_KEY}&group=no`);
                  const depData = await depRes.json();
                  
                  let departures = [];
                  if (depData.departures && depData.departures.all) {
                    departures = depData.departures.all.slice(0, 5); // Grab the next 5 trams
                  }
                  
                  if (departures.length === 0) {
                    popup.setContent(`
                      <div class="schedule-header" style="border-top: 4px solid ${dotColor};">
                        <p class="schedule-title">${displayTitle}</p>
                        <p class="schedule-subtitle">${lineStr}</p>
                      </div>
                      <div class="schedule-body" style="text-align: center; color: var(--text-muted); padding-top: 20px;">
                        No scheduled departures.
                      </div>
                    `);
                    return;
                  }
                  
                  // 3. Build the departure rows
                  let rowsHTML = departures.map(d => {
                    const dest = d.destination;
                    const timeStr = d.expected_departure_time || d.aimed_departure_time;
                    
                    let routeColor = "var(--accent)";
                    if (dest.includes("Toton") || dest.includes("Hucknall")) routeColor = "var(--green-line)";
                    if (dest.includes("Clifton") || dest.includes("Phoenix")) routeColor = "var(--purple-line)";
                    
                    // Calculate live minute countdown
                    const now = new Date();
                    const [hrs, mins] = timeStr.split(':');
                    const depTime = new Date();
                    depTime.setHours(parseInt(hrs), parseInt(mins), 0);
                    
                    let diffMins = Math.round((depTime - now) / 60000);
                    if (diffMins < 0) diffMins += 1440; // Prevent negative wrap around midnight
                    
                    let displayTime = diffMins <= 1 ? "Due" : `${diffMins} min`;
                    
                    return `
                      <div class="dep-row">
                        <div class="dep-dest" title="${dest}">
                          <div class="indicator" style="background-color: ${routeColor};"></div>
                          ${dest}
                        </div>
                        <div class="dep-time ${displayTime === 'Due' ? 'due' : ''}">${displayTime}</div>
                      </div>
                    `;
                  }).join('');
                  
                  popup.setContent(`
                    <div class="schedule-header" style="border-top: 4px solid ${dotColor};">
                      <p class="schedule-title">${displayTitle}</p>
                      <p class="schedule-subtitle">Live Departures</p>
                    </div>
                    <div class="schedule-body">
                      ${rowsHTML}
                    </div>
                  `);
                  
                } catch (err) {
                  console.error("Live Schedule Error:", err);
                  popup.setContent(`<div style="padding: 20px; text-align: center; color: var(--danger);">Failed to retrieve schedule.</div>`);
                }
              });
            }
          }
        });

        data.elements.forEach(el => {
          if (el.type === 'way' && el.nodes) {
            const wayCoords = el.nodes.map(nodeId => nodes[nodeId]).filter(coord => coord !== undefined);
            if (wayCoords.length > 0) {
              L.polyline(wayCoords, {
                color: '#38bdf8',
                weight: 3,
                opacity: 0.35
              }).addTo(map);
            }
          }
        });

        document.getElementById('loading-overlay').style.opacity = '0';
        setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 500);

      } catch (err) {
        console.error("Failed to load OSM data:", err);
        document.getElementById('loading-overlay').textContent = "Failed to sync network data.";
      }
    }

    loadTramNetwork();
  </script>

</body>
</html>
