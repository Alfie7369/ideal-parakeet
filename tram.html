<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>NET Tram Departures | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981; /* NET Green Accent */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --warning: #f59e0b;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 650px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .board {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .tram-row {
      display: flex;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      align-items: center;
      transition: background-color 0.2s;
    }
    .tram-row:last-child { border-bottom: none; }
    .tram-row:hover { background-color: rgba(255,255,255,0.02); }
    
    .time-col {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      width: 70px;
      flex-shrink: 0;
    }
    .dest-col {
      flex: 1;
      padding-right: 1rem;
    }
    .dest-col h3 { margin: 0 0 0.25rem 0; font-size: 1.05rem; }
    .dest-col p { margin: 0; font-size: 0.85rem; color: var(--text-muted); }
    
    .status-col {
      width: 90px;
      text-align: right;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }
    
    .loading { padding: 2rem; text-align: center; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>NET <span>Trams</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">University of Nottingham Departures</p>
    </div>

    <div class="board" id="tram-board">
      <div class="loading">Fetching live trams...</div>
    </div>
  </div>

  <script>
    async function fetchTrams() {
      const board = document.getElementById('tram-board');
      try {
        // Fetch departures using the AnyTransport API for NET stops
        // 9400ZZNOUNI1 is the ATCO code for the University of Nottingham tram stop
        const response = await fetch('https://net-tram-proxy.alfie-hawkes2006.workers.dev/');
        const data = await response.json();
        
        if (!data.departures || data.departures.length === 0) {
          board.innerHTML = '<div class="loading">No trams currently scheduled.</div>';
          return;
        }

        board.innerHTML = ''; // Clear loading text

        data.departures.forEach(tram => {
          const row = document.createElement('div');
          row.className = 'tram-row';
          
          const destination = tram.destination;
          const dueTime = tram.expectedDeparture || tram.aimedDeparture || '--:--';
          const waitText = tram.waitText || dueTime; // "Due", "7 min", etc.

          row.innerHTML = `
            <div class="time-col">${dueTime}</div>
            <div class="dest-col">
              <h3>${destination}</h3>
              <p>Nottingham Express Transit</p>
            </div>
            <div class="status-col">${waitText}</div>
          `;
          
          board.appendChild(row);
        });

      } catch (error) {
        board.innerHTML = '<div class="loading" style="color: var(--warning);">Connecting to NET Tram Network...<br><small style="opacity:0.7">Awaiting API response or proxy routing.</small></div>';
        console.error("Error fetching tram data:", error);
      }
    }

    // Load immediately, refresh every 60s
    fetchTrams();
    setInterval(fetchTrams, 60000);
  </script>

</body>
</html>
