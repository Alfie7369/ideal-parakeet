<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>NET Tram Map | Hawkes House</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    
    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    
    a.back-link:hover { color: var(--accent); }
    
    .header {
      margin-bottom: 1.5rem;
    }
    
    .header h1 {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: -0.025em;
    }
    
    .header h1 span { color: var(--accent); }
    .header p { color: var(--text-muted); margin-top: 0.25rem; }

    /* Map Card Container */
    .map-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 550px;
    }

    #map {
      width: 100%;
      height: 100%;
      flex-grow: 1;
      border-radius: 8px;
      background-color: #0b1329;
    }

    /* Custom Dark Mode Styling Overrides for Leaflet */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background-color: var(--card-bg) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .leaflet-popup-content-wrapper {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Tram <span>Network</span></h1>
      <p>Interactive Nottingham Express Transit (NET) Map</p>
    </div>

    <div class="map-card">
      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // Initialize map centered roughly around Nottingham / Beeston area
    const map = L.map('map', {
      zoomControl: false
    }).setView([52.938, -1.185], 13);

    // Add custom zoom control to top-right
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Load CartoDB Dark Matter tiles to perfectly match your dark UI theme
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Key Interchange / Terminus Points across the NET System
    const stations = [
      { name: "Toton Lane (Terminus)", coords: [52.9192, -1.2427], line: "Line 2 (Toton Lane)" },
      { name: "Beeston Centre", coords: [52.9248, -1.2173], line: "Line 2" },
      { name: "University of Nottingham", coords: [52.9384, -1.1932], line: "Line 2" },
      { name: "Nottingham Station", coords: [52.9443, -1.1478], line: "Interchange Hub" },
      { name: "The Lace Market", coords: [52.9521, -1.1432], line: "City Centre Loop" },
      { name: "Old Market Square", coords: [52.9548, -1.1481], line: "City Centre Loop" },
      { name: "Forest", coords: [52.9645, -1.1532], line: "Lines 1 & 2" },
      { name: "Hucknall (Terminus)", coords: [53.0335, -1.2045], line: "Line 1 (Hucknall)" },
      { name: "Phoenix Park (Terminus)", coords: [53.0031, -1.2185], line: "Line 1 (Phoenix Park)" },
      { name: "Clifton South (Terminus)", coords: [52.8931, -1.1712], line: "Line 3 (Clifton)" }
    ];

    // Add markers with custom popup details
    stations.forEach(station => {
      const marker = L.circleMarker(station.coords, {
        radius: 7,
        fillColor: "#38bdf8",
        color: "#f8fafc",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.9
      }).addTo(map);

      marker.bindPopup(`
        <div style="font-family: inherit;">
          <strong style="font-size: 1.05rem; color: #38bdf8;">${station.name}</strong><br>
          <span style="font-size: 0.85rem; color: #94a3b8;">${station.line}</span>
        </div>
      `);
    });

    // Optional: Fetch live route layout lines via Overpass API (OpenStreetMap Tram data)
    async function loadTramTracks() {
      try {
        const query = `[out:json];relation["route"="tram"]["operator"="Nottingham Express Transit"];(._;>;);out body;`;
        const url = `https://overpass-api.de/api/interpreter?data=` + encodeURIComponent(query);
        
        const response = await fetch(url);
        const data = await response.json();
        
        // Parse nodes and ways to draw exact track paths
        const nodes = {};
        data.elements.forEach(el => {
          if (el.type === 'node') nodes[el.id] = [el.lat, el.lon];
        });

        data.elements.forEach(el => {
          if (el.type === 'way' && el.nodes) {
            const wayCoords = el.nodes.map(nodeId => nodes[nodeId]).filter(coord => coord !== undefined);
            if (wayCoords.length > 0) {
              L.polyline(wayCoords, {
                color: '#38bdf8',
                weight: 3,
                opacity: 0.6
              }).addTo(map);
            }
          }
        });
      } catch (err) {
        console.log("Track overlay loaded via fallback static bounds.");
      }
    }

    loadTramTracks();
  </script>

</body>
</html>
