<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>NET Tram Departures | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 650px;
      width: 100%;
      height: 85vh; 
      display: flex;
      flex-direction: column;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .iframe-container {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>NET <span>Trams</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">University of Nottingham Departures</p>
    </div>

    <div class="iframe-container">
      <!-- Added an ID to the iframe so our script can target it -->
      <iframe id="tram-frame" src="https://bustimes.org/stations/940GZZNOUNI"></iframe>
    </div>
  </div>

  <script>
    // Silently reload the iframe every 60 seconds to pull the latest live tracking data
    setInterval(() => {
      const frame = document.getElementById('tram-frame');
      frame.src = frame.src;
    }, 60000);
  </script>
</body>
</html>
