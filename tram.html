<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>NET Tram Map | Hawkes House</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --green-line: #22c55e;
      --purple-line: #a855f7;
    }
    
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    
    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    
    a.back-link:hover { color: var(--accent); }
    
    .header {
      margin-bottom: 1.5rem;
    }
    
    .header h1 {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: -0.025em;
    }
    
    .header h1 span { color: var(--accent); }
    .header p { color: var(--text-muted); margin-top: 0.25rem; }

    .map-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 550px;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      flex-grow: 1;
      border-radius: 8px;
      background-color: #0b1329;
    }

    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1.1rem;
      transition: opacity 0.5s;
    }

    .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background-color: var(--card-bg) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0;
    }
    .leaflet-popup-content {
      margin: 0;
      width: 250px !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: var(--text-muted);
      padding: 8px;
    }
    
    .schedule-header {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
    }
    .schedule-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
    }
    .schedule-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 4px 0 0 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .schedule-body {
      padding: 10px 15px 15px 15px;
    }
    .dep-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .dep-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .dep-dest {
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }
    .dep-time {
      color: var(--accent);
      font-weight: bold;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .dep-time.due {
      color: var(--green-line);
      animation: pulse 2s infinite;
    }
    .indicator {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Tram <span>Network</span></h1>
      <p>Interactive Nottingham Express Transit (NET) Map</p>
    </div>

    <div class="map-card">
      <div id="loading-overlay">Loading NET network...</div>
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    const map = L.map('map', {
      zoomControl: false
    }).setView([52.955, -1.185], 12);

    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Static Dataset of NET Stations (100% reliable, zero external API queries needed)
    const tramStops = [
      { name: "Hucknall", lat: 53.0315, lon: -1.2058, line: "Green Line" },
      { name: "Butler's Hill", lat: 53.0185, lon: -1.2075, line: "Green Line" },
      { name: "Moor Bridge", lat: 53.0075, lon: -1.1995, line: "Green Line" },
      { name: "Bulwell Forest", lat: 52.9972, lon: -1.1935, line: "Green Line" },
      { name: "Bulwell", lat: 52.9875, lon: -1.1965, line: "Green Line" },
      { name: "Phoenix Park", lat: 52.9965, lon: -1.2225, line: "Purple Line" },
      { name: "Cinderhill", lat: 52.9885, lon: -1.2185, line: "Purple Line" },
      { name: "Highbury Vale", lat: 52.9815, lon: -1.1935, line: "Green & Purple Lines" },
      { name: "David Lane", lat: 52.9735, lon: -1.1895, line: "Green & Purple Lines" },
      { name: "Basford", lat: 52.9695, lon: -1.1855, line: "Green & Purple Lines" },
      { name: "Wilkinson Street", lat: 52.9655, lon: -1.1825, line: "Green & Purple Lines" },
      { name: "Radford Road", lat: 52.9615, lon: -1.1785, line: "Green & Purple Lines" },
      { name: "Hyson Green Market", lat: 52.9575, lon: -1.1765, line: "Green & Purple Lines" },
      { name: "Shipstone Street", lat: 52.9535, lon: -1.1745, line: "Green & Purple Lines" },
      { name: "Beaconsfield Street", lat: 52.9505, lon: -1.1725, line: "Green & Purple Lines" },
      { name: "Noel Street", lat: 52.9475, lon: -1.1705, line: "Green & Purple Lines" },
      { name: "The Forest", lat: 52.9445, lon: -1.1685, line: "Green & Purple Lines" },
      { name: "High School", lat: 52.9395, lon: -1.1565, line: "Green & Purple Lines" },
      { name: "Nottingham Trent University", lat: 52.9565, lon: -1.1545, line: "Green & Purple Lines" },
      { name: "Royal Centre", lat: 52.9545, lon: -1.1535, line: "Green & Purple Lines" },
      { name: "Old Market Square", lat: 52.9541, lon: -1.1481, line: "Green & Purple Lines" },
      { name: "Lace Market", lat: 52.9515, lon: -1.1435, line: "Green & Purple Lines" },
      { name: "Nottingham Station", lat: 52.9461, lon: -1.1472, line: "Green & Purple Lines" },
      { name: "Meadows Way West", lat: 52.9415, lon: -1.1525, line: "Green Line" },
      { name: "NG2", lat: 52.9375, lon: -1.1585, line: "Green Line" },
      { name: "Gregory Street", lat: 52.9385, lon: -1.1725, line: "Green Line" },
      { name: "Queens Medical Centre", lat: 52.9345, lon: -1.1865, line: "Green Line" },
      { name: "University of Nottingham", lat: 52.9328, lon: -1.1973, line: "Green Line" },
      { name: "University Boulevard", lat: 52.9312, lon: -1.2005, line: "Green Line" },
      { name: "Middle Street", lat: 52.9295, lon: -1.2125, line: "Green Line" },
      { name: "Beeston Centre", lat: 52.9285, lon: -1.2215, line: "Green Line" },
      { name: "Chilwell Road", lat: 52.9265, lon: -1.2305, line: "Green Line" },
      { name: "High Road", lat: 52.9245, lon: -1.2385, line: "Green Line" },
      { name: "Cator Lane", lat: 52.9225, lon: -1.2465, line: "Green Line" },
      { name: "Bramcote Lane", lat: 52.9205, lon: -1.2535, line: "Green Line" },
      { name: "Eskdale Drive", lat: 52.9185, lon: -1.2605, line: "Green Line" },
      { name: "Inham Road", lat: 52.9165, lon: -1.2675, line: "Green Line" },
      { name: "Toton Lane", lat: 52.9145, lon: -1.2755, line: "Green Line" },
      { name: "Queens Walk", lat: 52.9385, lon: -1.1445, line: "Purple Line" },
      { name: "Meadows Embankment", lat: 52.9315, lon: -1.1465, line: "Purple Line" },
      { name: "Wilford Village", lat: 52.9255, lon: -1.1505, line: "Purple Line" },
      { name: "Wilford Lane", lat: 52.9195, lon: -1.1555, line: "Purple Line" },
      { name: "Compton Acres", lat: 52.9135, lon: -1.1605, line: "Purple Line" },
      { name: "Ruddington Lane", lat: 52.9075, lon: -1.1645, line: "Purple Line" },
      { name: "Southchurch Drive", lat: 52.9015, lon: -1.1695, line: "Purple Line" },
      { name: "Rivergreen", lat: 52.8955, lon: -1.1735, line: "Purple Line" },
      { name: "Clifton Centre", lat: 52.8905, lon: -1.1775, line: "Purple Line" },
      { name: "Holy Trinity", lat: 52.8855, lon: -1.1815, line: "Purple Line" },
      { name: "Summerwood Lane", lat: 52.8805, lon: -1.1855, line: "Purple Line" },
      { name: "Clifton South", lat: 52.8755, lon: -1.1895, line: "Purple Line" }
    ];

    function getTimetableSlots(hour, lineType) {
      let interval = 7;
      if (hour < 7 || hour >= 21) interval = 15;
      else if ((hour >= 10 && hour < 15) || (hour >= 19 && hour < 21)) interval = 10;

      let slots = [];
      let baseOffset = lineType === 'green' ? 1 : 4;
      
      for (let m = baseOffset; m < 60; m += interval) {
        slots.push(m);
      }
      return slots;
    }

    function generateTimetableSchedule(displayTitle, lineStr, dotColor) {
      const now = new Date();
      const currentHour = now.getHours();
      const currentMinute = now.getMinutes();
      
      let departures = [];

      function evaluateDirection(dest, lineType, color) {
        let slots = getTimetableSlots(currentHour, lineType);
        let nextHourSlots = getTimetableSlots((currentHour + 1) % 24, lineType);
        
        let allMinutes = [];
        slots.forEach(m => {
          if (m >= currentMinute) allMinutes.push(m - currentMinute);
          else allMinutes.push((60 - currentMinute) + m);
        });
        
        nextHourSlots.forEach(m => {
          allMinutes.push((60 - currentMinute) + 60 + m);
        });

        allMinutes.sort((a, b) => a - b);
        let uniqueMins = [...new Set(allMinutes)].slice(0, 3);

        uniqueMins.forEach(diff => {
          departures.push({
            dest: dest,
            time: diff <= 1 ? "Due" : `${diff} min`,
            val: diff,
            color: color
          });
        });
      }

      if (lineStr.includes("Green")) {
        if (displayTitle !== "Hucknall") evaluateDirection("Hucknall", "green", "var(--green-line)");
        if (displayTitle !== "Toton Lane") evaluateDirection("Toton Lane", "green", "var(--green-line)");
      }
      
      if (lineStr.includes("Purple")) {
        if (displayTitle !== "Phoenix Park") evaluateDirection("Phoenix Park", "purple", "var(--purple-line)");
        if (displayTitle !== "Clifton South") evaluateDirection("Clifton South", "purple", "var(--purple-line)");
      }

      departures.sort((a, b) => a.val - b.val);
      const nextTrams = departures.slice(0, 4);

      let rowsHTML = nextTrams.map(d => `
        <div class="dep-row">
          <div class="dep-dest" title="${d.dest}">
            <div class="indicator" style="background-color: ${d.color};"></div>
            ${d.dest}
          </div>
          <div class="dep-time ${d.time === 'Due' ? 'due' : ''}">${d.time}</div>
        </div>
      `).join('');

      return `
        <div class="schedule-header" style="border-top: 4px solid ${dotColor};">
          <p class="schedule-title">${displayTitle}</p>
          <p class="schedule-subtitle">Official Timetable Matrix</p>
        </div>
        <div class="schedule-body">
          ${rowsHTML}
        </div>
      `;
    }

    function initMap() {
      tramStops.forEach(stop => {
        let dotColor = "#38bdf8";
        if (stop.line.includes("Green")) dotColor = "#22c55e";
        if (stop.line.includes("Purple")) dotColor = "#a855f7";
        if (stop.line.includes("Green & Purple")) dotColor = "#f8fafc";

        const marker = L.circleMarker([stop.lat, stop.lon], {
          radius: 6,
          fillColor: dotColor,
          color: "#0f172a",
          weight: 2,
          opacity: 1,
          fillOpacity: 1
        }).addTo(map);

        marker.bindPopup(generateTimetableSchedule(stop.name, stop.line, dotColor));
      });

      document.getElementById('loading-overlay').style.opacity = '0';
      setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 500);
    }

    initMap();
  </script>

</body>
</html>
