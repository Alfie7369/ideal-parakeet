<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local News | Hawkes House</title>
  
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --hover-bg: #2dd4bf;
    }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 650px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover {
      color: var(--accent);
    }
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .header h1 {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: -0.025em;
    }
    .header h1 span { color: var(--accent); }
    .header p { color: var(--text-muted); margin-top: 0.5rem; }
    
    .news-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: border-color 0.2s, transform 0.2s;
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .news-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .news-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      line-height: 1.4;
    }
    .news-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0 0 1rem 0;
      line-height: 1.5;
    }
    .news-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 500;
    }
    .timestamp {
      background: rgba(56, 189, 248, 0.1);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
    }
    
    #loading {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem;
      font-style: italic;
    }
    
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--hover-bg);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(45, 212, 191, 0); }
      100% { box-shadow: 0 0 0 0 rgba(45, 212, 191, 0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>East Midlands <span>News</span></h1>
      <p><span class="status-dot"></span>Live BBC Updates</p>
    </div>

    <div id="news-feed">
      <div id="loading">Fetching latest headlines...</div>
    </div>
  </div>

  <script>
    // The official BBC Nottingham & East Midlands RSS feed
    const rssUrl = 'https://feeds.bbci.co.uk/news/england/nottingham/rss.xml';

    function timeAgo(dateString) {
      if (!dateString) return "Recently";
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      
      let interval = seconds / 3600;
      if (interval >= 1) {
        const hours = Math.floor(interval);
        return hours + (hours === 1 ? " hour ago" : " hours ago");
      }
      
      interval = seconds / 60;
      if (interval >= 1) return Math.floor(interval) + " mins ago";
      
      return "Just now";
    }

    async function fetchNews() {
      const feedContainer = document.getElementById('news-feed');
      
      try {
        // corsproxy.io is much better at bypassing strict news site firewalls
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(rssUrl);
        
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Proxy fetch failed with status: " + response.status);
        
        // Fetch the raw XML text directly
        const xmlText = await response.text();

        // Use the browser's built-in XML parser
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        
        // Extract all the article items
        const items = Array.from(xmlDoc.querySelectorAll('item')).slice(0, 5);
        
        if (items.length === 0) throw new Error("No news items found in XML");

        feedContainer.innerHTML = ''; // Clear loading text
        
        items.forEach(item => {
          const title = item.querySelector('title')?.textContent || 'No title';
          const description = item.querySelector('description')?.textContent || '';
          const link = item.querySelector('link')?.textContent || '#';
          const pubDate = item.querySelector('pubDate')?.textContent || '';
          
          const card = document.createElement('a');
          card.className = 'news-card';
          card.href = link;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          
          card.innerHTML = `
            <h3 class="news-title">${title}</h3>
            <p class="news-desc">${description}</p>
            <div class="news-meta">
              <span class="timestamp">${timeAgo(pubDate)}</span>
              <span>Read more →</span>
            </div>
          `;
          
          feedContainer.appendChild(card);
        });
      } catch (error) {
        console.error("News fetch error:", error);
        feedContainer.innerHTML = '<div id="loading">Failed to load headlines. Trying again shortly...</div>';
      }
    }

    // Initial fetch
    fetchNews();
    
    // Refresh feed every 15 minutes
    setInterval(fetchNews, 900000);
  </script>

</body>
</html>
