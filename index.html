<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hawkes House Dashboard</title>
  <style>
    :root {
      --text-muted: #a0a0a0;
    }
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      transition: background-color 0.2s;
    }
    a.card-link .card:hover {
      background-color: #2a2a2a;
    }
    .card h2 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.2rem;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #4CAF50; 
      margin-right: 8px;
    }
    .dot.offline {
      background-color: #f44336; 
    }
    .dot.neutral {
      background-color: var(--text-muted); 
    }
    .card-link {
      text-decoration: none;
      color: inherit;
      display: block; 
    }
    .radio-button {
      display: inline-block;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 5px;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .radio-button:hover {
      background-color: #444;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Home Assistant</h2>
    <div class="status-indicator">
      <div class="dot offline"></div> Awaiting Hardware
    </div>
  </div>

  <div class="card">
    <h2>Public DNS</h2>
    <div class="status-indicator">
      <div class="dot"></div> Online & Secured
    </div>
  </div>

  <a href="media.html" class="card-link">
    <div class="card">
      <h2>Media Archive</h2>
      <div class="status-indicator" style="color: var(--text-muted);">
        <div class="dot neutral"></div> View CD Catalog
      </div>
    </div>
  </a>

  <a href="portfolio.html" class="card-link">
    <div class="card">
      <h2>Academic Portfolio</h2>
      <div class="status-indicator" style="color: var(--text-muted);">
        <div class="dot neutral"></div> View Mathematics
      </div>
    </div>
  </a>

  <div style="margin-top: 5px;">
    <a href="radio.html" class="radio-button">Live Radio Streams</a>
  </div>

  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "c666bf6781104f84b2c84ee0b34513cb"}'></script>

</body>
</html>
