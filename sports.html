<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Match Day | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --live-red: #ef4444;
      --villa-claret: #670E36;
      --villa-blue: #95BFE5;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 800px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .scoreboard {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .match-row {
      display: grid;
      grid-template-columns: 80px 1fr 100px 1fr;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s;
    }
    .match-row:last-child { border-bottom: none; }
    .match-row:hover { background-color: rgba(255,255,255,0.02); }
    
    .team {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .team.home { justify-content: flex-end; text-align: right; }
    .team.away { justify-content: flex-start; text-align: left; }
    
    .highlight { color: var(--accent); }
    .highlight-villa { color: var(--villa-blue); }
    
    .score-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      margin: 0 1rem;
    }
    .score-numbers {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-main);
    }
    .score-scheduled {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: normal;
    }
    
    .status {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .status-live { color: var(--live-red); display: flex; align-items: center; gap: 4px; }
    .status-ft { color: var(--text-muted); }
    .status-pending { color: var(--accent); }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--live-red);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .loading { padding: 3rem; text-align: center; color: var(--text-muted); }
    .api-warning { padding: 2rem; text-align: center; color: var(--warning); border-bottom: 1px solid var(--border); }

    @media (max-width: 600px) {
      .match-row {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 0.75rem;
      }
      .team.home, .team.away { justify-content: center; text-align: center; }
      .score-container { margin: 0 auto; width: 120px; }
      .status { display: flex; justify-content: center; margin-bottom: 0.5rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Match Day <span>Scoreboard</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">Live API-Football Fixtures</p>
    </div>

    <div class="scoreboard" id="scoreboard-container">
      <div class="loading">Connecting to live sports feed...</div>
    </div>
  </div>

  <script>
    // --- PASTE YOUR API-FOOTBALL KEY HERE ---
    const API_KEY = 'bc7cd898dabe901bd62777d9a0df3485'; 
    
    // We match by string to avoid ID complications across different leagues
    const TRACKED_TEAMS = ['Aston Villa', 'Nottingham Forest', 'Leicester', 'Notts County'];

    function getTodayDate() {
      const today = new Date();
      return today.toISOString().split('T')[0];
    }

    function formatTime(isoString) {
      const date = new Date(isoString);
      return date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    async function fetchLiveScores() {
      const container = document.getElementById('scoreboard-container');

      if (API_KEY === 'YOUR_API_KEY_HERE') {
        container.innerHTML = `<div class="api-warning">Please enter your free api-sports.io key in the script to activate live scoring.</div>`;
        return;
      }

      try {
        const dateStr = getTodayDate();
        const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${dateStr}`, {
          method: 'GET',
          headers: {
            'x-apisports-key': API_KEY
          }
        });
        
        const data = await response.json();
        
        if (data.errors && data.errors.requests) {
          throw new Error("API rate limit reached for today.");
        }

        const allFixtures = data.response || [];
        
        // Filter out only our tracked teams
        const localMatches = allFixtures.filter(match => {
          const homeName = match.teams.home.name;
          const awayName = match.teams.away.name;
          return TRACKED_TEAMS.some(team => homeName.includes(team) || awayName.includes(team));
        });

        if (localMatches.length === 0) {
          container.innerHTML = `<div class="loading">No tracked fixtures scheduled for today.</div>`;
          return;
        }

        container.innerHTML = '';

        localMatches.forEach(match => {
          const row = document.createElement('div');
          row.className = 'match-row';

          const homeTeam = match.teams.home.name;
          const awayTeam = match.teams.away.name;
          const statusShort = match.fixture.status.short;
          const elapsed = match.fixture.status.elapsed;
          
          let state = 'scheduled';
          if (['1H', 'HT', '2H', 'ET', 'P', 'LIVE'].includes(statusShort)) state = 'live';
          if (['FT', 'AET', 'PEN'].includes(statusShort)) state = 'finished';

          // Format Status
          let statusHtml = '';
          if (state === 'live') {
            statusHtml = `<div class="status status-live"><div class="pulse-dot"></div> ${elapsed}'</div>`;
          } else if (state === 'finished') {
            statusHtml = `<div class="status status-ft">FT</div>`;
          } else {
            const time = formatTime(match.fixture.date);
            statusHtml = `<div class="status status-pending">Today</div>`;
          }

          // Format Score Box
          let scoreHtml = '';
          if (state === 'scheduled') {
            const time = formatTime(match.fixture.date);
            scoreHtml = `<div class="score-scheduled">${time}</div>`;
          } else {
            const goalsHome = match.goals.home !== null ? match.goals.home : 0;
            const goalsAway = match.goals.away !== null ? match.goals.away : 0;
            scoreHtml = `<div class="score-numbers">${goalsHome} - ${goalsAway}</div>`;
          }

          // Highlight tracked teams
          let homeClass = 'team home';
          let awayClass = 'team away';
          
          if (homeTeam.includes('Aston Villa')) homeClass += ' highlight-villa';
          else if (TRACKED_TEAMS.some(t => homeTeam.includes(t))) homeClass += ' highlight';
          
          if (awayTeam.includes('Aston Villa')) awayClass += ' highlight-villa';
          else if (TRACKED_TEAMS.some(t => awayTeam.includes(t))) awayClass += ' highlight';

          row.innerHTML = `
            ${statusHtml}
            <div class="${homeClass}">${homeTeam}</div>
            <div class="score-container">${scoreHtml}</div>
            <div class="${awayClass}">${awayTeam}</div>
          `;
          
          container.appendChild(row);
        });

      } catch (error) {
        console.error("Failed to load live scores:", error);
        container.innerHTML = `<div class="loading" style="color: var(--live-red);">Failed to retrieve API-Football feed. ${error.message}</div>`;
      }
    }

    fetchLiveScores();
    
    // Refresh every 15 minutes (900000 ms). 
    // This uses exactly 96 requests per day, staying safely under the 100/day free limit!
    setInterval(fetchLiveScores, 900000); 
  </script>
</body>
</html>
