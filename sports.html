<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Match Day | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --live-red: #ef4444;
      --villa-blue: #95BFE5;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 1200px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }
    
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 1.2rem;
      font-weight: 600;
      background-color: rgba(0,0,0,0.2);
    }

    /* Fixtures Section */
    .match-row {
      display: grid;
      grid-template-columns: 80px 1fr 100px 1fr;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s;
    }
    .match-row:last-child { border-bottom: none; }
    .match-row:hover { background-color: rgba(255,255,255,0.02); }
    
    .team-col {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .team-col.home { align-items: flex-end; text-align: right; }
    .team-col.away { align-items: flex-start; text-align: left; }
    
    .team-name { font-size: 1.1rem; font-weight: 600; }
    .venue-name { font-size: 0.75rem; color: var(--text-muted); }
    
    .highlight { color: var(--accent); }
    .highlight-villa { color: var(--villa-blue); }
    
    .score-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      margin: 0 1rem;
    }
    .score-numbers {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-main);
    }
    .score-scheduled { font-size: 1.1rem; color: var(--text-muted); font-weight: normal; }
    
    .status { font-size: 0.85rem; font-weight: 600; }
    .status-live { color: var(--live-red); display: flex; align-items: center; gap: 4px; }
    .status-ft { color: var(--text-muted); }
    .status-pending { color: var(--accent); }

    .pulse-dot {
      width: 8px; height: 8px;
      background-color: var(--live-red);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* League Tables Section */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      padding: 1.5rem;
    }
    
    .league-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .league-table th {
      text-align: left;
      color: var(--text-muted);
      padding: 0.5rem;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }
    .league-table td { padding: 0.5rem; border-bottom: 1px solid rgba(51, 65, 85, 0.4); }
    .league-table tr:last-child td { border-bottom: none; }
    .table-pos { width: 30px; color: var(--text-muted); }
    .table-pts { font-weight: 700; color: var(--accent); }
    .tracked-row td { background-color: rgba(56, 189, 248, 0.05); font-weight: 600; }

    .loading { padding: 3rem; text-align: center; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Match Day <span>Scoreboard</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">Live ESPN Fixtures & Tables</p>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header">Today's Fixtures</div>
        <div id="scoreboard-container">
          <div class="loading">Connecting to live sports feed...</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">League Standings</div>
        <div class="tables-grid" id="tables-container">
          <div class="loading">Fetching league tables...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TRACKED_TEAMS = ['Aston Villa', 'Nottingham Forest', 'Leicester City', 'Notts County'];

    function isTrackedTeam(teamName) {
      return TRACKED_TEAMS.some(t => teamName.includes(t));
    }

    function formatTime(isoString) {
      const date = new Date(isoString);
      return date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    // --- ESPN Data Fetchers ---
    // Fetch live scores from ESPN's hidden scoreboard endpoints
    async function fetchESPNScoreboard(leagueCode) {
      try {
        const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueCode}/scoreboard`);
        const data = await response.json();
        return data.events || [];
      } catch (error) {
        console.error(`Error fetching scores for ${leagueCode}:`, error);
        return [];
      }
    }

    async function updateScores() {
      const container = document.getElementById('scoreboard-container');
      
      // Fetch Premier League (eng.1), League One (eng.3), and League Two (eng.4)
      const [pl, l1, l2] = await Promise.all([
        fetchESPNScoreboard('eng.1'),
        fetchESPNScoreboard('eng.3'),
        fetchESPNScoreboard('eng.4')
      ]);

      const allMatches = [...pl, ...l1, ...l2];
      
      const localMatches = allMatches.filter(event => {
        const homeTeam = event.competitions[0].competitors.find(c => c.homeAway === 'home').team.name;
        const awayTeam = event.competitions[0].competitors.find(c => c.homeAway === 'away').team.name;
        return isTrackedTeam(homeTeam) || isTrackedTeam(awayTeam);
      });

      if (localMatches.length === 0) {
        container.innerHTML = `<div class="loading">No tracked fixtures scheduled for today.</div>`;
        return;
      }

      container.innerHTML = '';
      localMatches.forEach(event => {
        const row = document.createElement('div');
        row.className = 'match-row';
        
        const competition = event.competitions[0];
        const homeCompetitor = competition.competitors.find(c => c.homeAway === 'home');
        const awayCompetitor = competition.competitors.find(c => c.homeAway === 'away');
        
        const homeTeam = homeCompetitor.team.name;
        const awayTeam = awayCompetitor.team.name;
        const venue = competition.venue ? competition.venue.fullName : 'TBA';
        const statusDetails = event.status.type;
        
        let state = 'scheduled';
        if (statusDetails.state === 'in') state = 'live';
        if (statusDetails.state === 'post') state = 'finished';

        let statusHtml = state === 'live' 
          ? `<div class="status status-live"><div class="pulse-dot"></div> ${event.status.displayClock}'</div>`
          : state === 'finished' 
            ? `<div class="status status-ft">FT</div>`
            : `<div class="status status-pending">Today</div>`;

        let scoreHtml = state === 'scheduled'
          ? `<div class="score-scheduled">${formatTime(event.date)}</div>`
          : `<div class="score-numbers">${homeCompetitor.score} - ${awayCompetitor.score}</div>`;

        let homeClass = 'team-name';
        if (homeTeam.includes('Aston Villa')) homeClass += ' highlight-villa';
        else if (isTrackedTeam(homeTeam)) homeClass += ' highlight';
        
        let awayClass = 'team-name';
        if (awayTeam.includes('Aston Villa')) awayClass += ' highlight-villa';
        else if (isTrackedTeam(awayTeam)) awayClass += ' highlight';

        row.innerHTML = `
          ${statusHtml}
          <div class="team-col home">
            <div class="${homeClass}">${homeTeam}</div>
            <div class="venue-name">${venue}</div>
          </div>
          <div class="score-container">${scoreHtml}</div>
          <div class="team-col away">
            <div class="${awayClass}">${awayTeam}</div>
          </div>
        `;
        container.appendChild(row);
      });
    }

    // Fetch league tables from ESPN's hidden standings endpoint
    async function fetchESPNStandings(leagueCode, leagueName) {
      try {
        const res = await fetch(`https://site.web.api.espn.com/apis/v2/sports/soccer/${leagueCode}/standings?level=3`);
        const data = await res.json();
        
        // ESPN stores the standings array deeply nested
        const standingsArr = data.children[0].standings.entries;
        
        // Extract relevant data
        const table = standingsArr.map(entry => {
          const stats = entry.stats;
          const played = stats.find(s => s.name === 'gamesPlayed').displayValue;
          const gd = stats.find(s => s.name === 'pointDifferential').displayValue;
          const pts = stats.find(s => s.name === 'points').displayValue;
          const rank = stats.find(s => s.name === 'rank').displayValue;
          
          return {
            rank: rank,
            teamName: entry.team.name,
            played: played,
            gd: gd,
            pts: pts
          };
        });

        return { name: leagueName, table: table };
      } catch (err) {
        console.error(`Error fetching standings for ${leagueName}:`, err);
        return { name: leagueName, table: null };
      }
    }

    async function updateTables() {
      const container = document.getElementById('tables-container');
      
      const plData = await fetchESPNStandings('eng.1', "Premier League");
      const l1Data = await fetchESPNStandings('eng.3', "League One");
      const l2Data = await fetchESPNStandings('eng.4', "League Two");

      container.innerHTML = '';
      
      [plData, l1Data, l2Data].forEach(league => {
        if (!league.table) {
          const errorMsg = document.createElement('div');
          errorMsg.className = "loading";
          errorMsg.textContent = `${league.name} data not currently available.`;
          container.appendChild(errorMsg);
          return;
        }

        let rowsHtml = '';
        league.table.forEach(teamData => {
          const isTracked = isTrackedTeam(teamData.teamName);
          rowsHtml += `
            <tr class="${isTracked ? 'tracked-row' : ''}">
              <td class="table-pos">${teamData.rank}</td>
              <td>${teamData.teamName}</td>
              <td>${teamData.played}</td>
              <td>${teamData.gd}</td>
              <td class="table-pts">${teamData.pts}</td>
            </tr>
          `;
        });

        const tableWrapper = document.createElement('div');
        tableWrapper.innerHTML = `
          <h3 style="margin-top: 0; margin-bottom: 0.5rem; font-size: 1.05rem; color: var(--text-muted);">${league.name}</h3>
          <table class="league-table">
            <thead>
              <tr>
                <th class="table-pos">#</th>
                <th>Team</th>
                <th>P</th>
                <th>GD</th>
                <th>Pts</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        `;
        container.appendChild(tableWrapper);
      });
    }

    // Initialize Dashboard
    updateScores();
    updateTables();
    
    // Refresh scores every 60 seconds (since it's a free, high-limit endpoint)
    setInterval(updateScores, 60000); 
    // Refresh tables every hour
    setInterval(updateTables, 3600000);
  </script>
</body>
</html>
