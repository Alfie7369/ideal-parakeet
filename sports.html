<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Match Day | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --live-red: #ef4444;
      --villa-blue: #95BFE5;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 1200px; /* Widened slightly to accommodate 3 tables beautifully */
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }
    
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 1.2rem;
      font-weight: 600;
      background-color: rgba(0,0,0,0.2);
    }

    /* Fixtures Section */
    .match-row {
      display: grid;
      grid-template-columns: 80px 1fr 100px 1fr;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s;
    }
    .match-row:last-child { border-bottom: none; }
    .match-row:hover { background-color: rgba(255,255,255,0.02); }
    
    .team-col {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .team-col.home { align-items: flex-end; text-align: right; }
    .team-col.away { align-items: flex-start; text-align: left; }
    
    .team-name { font-size: 1.1rem; font-weight: 600; }
    .venue-name { font-size: 0.75rem; color: var(--text-muted); }
    
    .highlight { color: var(--accent); }
    .highlight-villa { color: var(--villa-blue); }
    
    .score-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      margin: 0 1rem;
    }
    .score-numbers {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-main);
    }
    .score-scheduled { font-size: 1.1rem; color: var(--text-muted); font-weight: normal; }
    
    .status { font-size: 0.85rem; font-weight: 600; }
    .status-live { color: var(--live-red); display: flex; align-items: center; gap: 4px; }
    .status-ft { color: var(--text-muted); }
    .status-pending { color: var(--accent); }

    .pulse-dot {
      width: 8px; height: 8px;
      background-color: var(--live-red);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* League Tables Section */
    .tables-grid {
      display: grid;
      /* Auto-fit dynamically wraps the tables into 1, 2, or 3 columns depending on screen size */
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      padding: 1.5rem;
    }
    
    .league-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .league-table th {
      text-align: left;
      color: var(--text-muted);
      padding: 0.5rem;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }
    .league-table td { padding: 0.5rem; border-bottom: 1px solid rgba(51, 65, 85, 0.4); }
    .league-table tr:last-child td { border-bottom: none; }
    .table-pos { width: 30px; color: var(--text-muted); }
    .table-pts { font-weight: 700; color: var(--accent); }
    .tracked-row td { background-color: rgba(56, 189, 248, 0.05); font-weight: 600; }

    .loading { padding: 3rem; text-align: center; color: var(--text-muted); }
    .api-warning { padding: 2rem; text-align: center; color: var(--warning); border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Match Day <span>Scoreboard</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">Live API-Football Fixtures & Tables</p>
    </div>

    <div class="dashboard-grid">
      <!-- Live Fixtures -->
      <div class="card">
        <div class="card-header">Today's Fixtures</div>
        <div id="scoreboard-container">
          <div class="loading">Connecting to live sports feed...</div>
        </div>
      </div>

      <!-- Standings Tables -->
      <div class="card">
        <div class="card-header">League Standings</div>
        <div class="tables-grid" id="tables-container">
          <div class="loading">Fetching league tables...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- PASTE YOUR API-FOOTBALL KEY HERE ---
    const API_KEY = 'bc7cd898dabe901bd62777d9a0df3485'; 
    
    // Name Matching logic (filters out U21 and Women's squads safely)
    const TRACKED_TEAMS = ['Aston Villa', 'Nottingham Forest', 'Leicester', 'Notts County'];
    const EXCLUDE_TERMS = [' W', ' U21', ' U18', ' U23', ' Women'];

    function isTrackedTeam(teamName) {
      const isMatch = TRACKED_TEAMS.some(t => teamName.includes(t));
      const isExcluded = EXCLUDE_TERMS.some(e => teamName.includes(e));
      return isMatch && !isExcluded;
    }

    const d = new Date();
    const currentSeason = d.getMonth() < 6 ? d.getFullYear() - 1 : d.getFullYear();

    function formatTime(isoString) {
      const date = new Date(isoString);
      return date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    // Utility to pause execution and prevent API rate-limiting
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function fetchLiveScores() {
      const container = document.getElementById('scoreboard-container');

      if (API_KEY === 'YOUR_API_KEY_HERE') {
        container.innerHTML = `<div class="api-warning">Please enter your free api-sports.io key in the script to activate live scoring.</div>`;
        return;
      }

      try {
        const dateStr = d.toISOString().split('T')[0];
        const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${dateStr}`, {
          method: 'GET',
          headers: { 'x-apisports-key': API_KEY }
        });
        
        const data = await response.json();
        
        if (data.errors && Object.keys(data.errors).length > 0) {
          console.error("API Error (Fixtures):", data.errors);
          if (data.errors.requests) throw new Error("Daily API limit reached.");
        }

        const allFixtures = data.response || [];
        
        const localMatches = allFixtures.filter(match => 
          isTrackedTeam(match.teams.home.name) || isTrackedTeam(match.teams.away.name)
        );

        if (localMatches.length === 0) {
          container.innerHTML = `<div class="loading">No tracked fixtures scheduled for today.</div>`;
          return;
        }

        container.innerHTML = '';
        localMatches.forEach(match => {
          const row = document.createElement('div');
          row.className = 'match-row';

          const homeTeam = match.teams.home.name;
          const awayTeam = match.teams.away.name;
          const statusShort = match.fixture.status.short;
          const venue = match.fixture.venue.name || 'TBA';
          
          let state = 'scheduled';
          if (['1H', 'HT', '2H', 'ET', 'P', 'LIVE'].includes(statusShort)) state = 'live';
          if (['FT', 'AET', 'PEN'].includes(statusShort)) state = 'finished';

          let statusHtml = state === 'live' 
            ? `<div class="status status-live"><div class="pulse-dot"></div> ${match.fixture.status.elapsed}'</div>`
            : state === 'finished' 
              ? `<div class="status status-ft">FT</div>`
              : `<div class="status status-pending">Today</div>`;

          let scoreHtml = state === 'scheduled'
            ? `<div class="score-scheduled">${formatTime(match.fixture.date)}</div>`
            : `<div class="score-numbers">${match.goals.home ?? 0} - ${match.goals.away ?? 0}</div>`;

          let homeClass = 'team-name';
          if (homeTeam.includes('Aston Villa')) homeClass += ' highlight-villa';
          else if (isTrackedTeam(homeTeam)) homeClass += ' highlight';
          
          let awayClass = 'team-name';
          if (awayTeam.includes('Aston Villa')) awayClass += ' highlight-villa';
          else if (isTrackedTeam(awayTeam)) awayClass += ' highlight';

          row.innerHTML = `
            ${statusHtml}
            <div class="team-col home">
              <div class="${homeClass}">${homeTeam}</div>
              <div class="venue-name">${venue}</div>
            </div>
            <div class="score-container">${scoreHtml}</div>
            <div class="team-col away">
              <div class="${awayClass}">${awayTeam}</div>
            </div>
          `;
          container.appendChild(row);
        });

      } catch (error) {
        console.error("Score Error:", error);
        container.innerHTML = `<div class="loading" style="color: var(--live-red);">Error loading fixtures. Check console.</div>`;
      }
    }

    async function fetchLeagueTable(leagueId, leagueName) {
      const cacheKey = `standings_v3_league_${leagueId}_${currentSeason}`;
      const cacheTime = localStorage.getItem(cacheKey + '_time');
      const now = new Date().getTime();

      let standingsData = null;

      if (cacheTime && (now - parseInt(cacheTime) < 43200000)) {
        standingsData = JSON.parse(localStorage.getItem(cacheKey));
      } else {
        try {
          const res = await fetch(`https://v3.football.api-sports.io/standings?season=${currentSeason}&league=${leagueId}`, {
            headers: { 'x-apisports-key': API_KEY }
          });
          const data = await res.json();
          
          if (data.errors && Object.keys(data.errors).length > 0) {
            console.error(`API Error for ${leagueName}:`, data.errors);
            return { name: leagueName, table: null };
          }

          if (data.response && data.response.length > 0) {
            standingsData = data.response[0].league.standings[0];
            localStorage.setItem(cacheKey, JSON.stringify(standingsData));
            localStorage.setItem(cacheKey + '_time', now.toString());
          }
        } catch (err) {
          console.error(`Network Error fetching ${leagueName}:`, err);
        }
      }
      return { name: leagueName, table: standingsData };
    }

    async function loadTables() {
      if (API_KEY === 'YOUR_API_KEY_HERE') return;

      const container = document.getElementById('tables-container');
      
      // Fetch sequentially with a 1-second delay to bypass free-tier burst limits
      const plData = await fetchLeagueTable(39, "Premier League");
      await sleep(1000); 
      const l1Data = await fetchLeagueTable(41, "League One");
      await sleep(1000);
      const l2Data = await fetchLeagueTable(42, "League Two");

      container.innerHTML = '';
      
      [plData, l1Data, l2Data].forEach(league => {
        if (!league.table) {
          const errorMsg = document.createElement('div');
          errorMsg.className = "loading";
          errorMsg.textContent = `${league.name} data not currently available.`;
          container.appendChild(errorMsg);
          return;
        }

        let rowsHtml = '';
        league.table.forEach(teamData => {
          const isTracked = isTrackedTeam(teamData.team.name);
          rowsHtml += `
            <tr class="${isTracked ? 'tracked-row' : ''}">
              <td class="table-pos">${teamData.rank}</td>
              <td>${teamData.team.name}</td>
              <td>${teamData.all.played}</td>
              <td>${teamData.goalsDiff}</td>
              <td class="table-pts">${teamData.points}</td>
            </tr>
          `;
        });

        const tableWrapper = document.createElement('div');
        tableWrapper.innerHTML = `
          <h3 style="margin-top: 0; margin-bottom: 0.5rem; font-size: 1.05rem; color: var(--text-muted);">${league.name}</h3>
          <table class="league-table">
            <thead>
              <tr>
                <th class="table-pos">#</th>
                <th>Team</th>
                <th>P</th>
                <th>GD</th>
                <th>Pts</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        `;
        container.appendChild(tableWrapper);
      });
    }

    fetchLiveScores();
    loadTables();
    setInterval(fetchLiveScores, 900000);
  </script>
</body>
</html>
