<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Live Radio | Hawkes House</title>
  
  <!-- HLS script for modern BBC streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 650px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover {
      color: var(--accent);
    }
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .header h1 {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: -0.025em;
    }
    .header h1 span { color: var(--accent); }
    .header p { color: var(--text-muted); margin-top: 0.5rem; }
    
    .station {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, border-color 0.2s;
    }
    .station:hover {
      border-color: var(--accent);
    }
    .station-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .station h3 {
      margin: 0;
      font-size: 1rem;
      color: var(--text-main);
      font-weight: 600;
      letter-spacing: 0.025em;
    }
    .live-badge {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--success);
      background: rgba(16, 185, 129, 0.1);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    audio {
      width: 100%;
      height: 36px;
      outline: none;
      border-radius: 6px;
      accent-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Live <span>Radio</span></h1>
      <p>Hawkes House Audio Gateway</p>
    </div>

    <div class="station">
      <div class="station-info">
        <h3>BBC Radio Nottingham</h3>
        <span class="live-badge">Live Stream</span>
      </div>
      <audio id="audio-nottingham" controls preload="none"></audio>
    </div>

    <div class="station">
      <div class="station-info">
        <h3>BBC Radio Leicester</h3>
        <span class="live-badge">Live Stream</span>
      </div>
      <audio id="audio-leicester" controls preload="none"></audio>
    </div>

    <div class="station">
      <div class="station-info">
        <h3>Classic FM</h3>
        <span class="live-badge">Live Stream</span>
      </div>
      <audio controls preload="none">
        <source src="https://media-ssl.musicradio.com/ClassicFM" type="audio/mpeg">
      </audio>
    </div>

    <div class="station">
      <div class="station-info">
        <h3>University Radio Nottingham (URN)</h3>
        <span class="live-badge">Live Stream</span>
      </div>
      <audio controls preload="none">
        <source src="https://live.urn1350.co.uk/listen" type="audio/mpeg">
      </audio>
    </div>

    <div class="station">
      <div class="station-info">
        <h3>Fosse 107</h3>
        <span class="live-badge">Live Stream</span>
      </div>
      <audio controls preload="none">
        <source src="https://radio-proxy.alfie-hawkes2006.workers.dev/?station=fosse" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <script>
    function setupHlsStream(elementId, streamUrl) {
      const audio = document.getElementById(elementId);
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(audio);
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        audio.src = streamUrl;
      }
    }

    setupHlsStream('audio-nottingham', 'https://as-hls-uk-live.akamaized.net/pool_96088503/live/uk/bbc_radio_nottingham/bbc_radio_nottingham.isml/bbc_radio_nottingham-audio%3d96000.norewind.m3u8');
    setupHlsStream('audio-leicester', 'https://as-hls-uk-live.akamaized.net/pool_04542919/live/uk/bbc_radio_leicester/bbc_radio_leicester.isml/bbc_radio_leicester-audio%3d96000.norewind.m3u8');
  </script>

</body>
</html>
