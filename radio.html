<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Radio | Hawkes House</title>
  
  <!-- This script teaches your browser how to play modern BBC HLS streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 1rem;
      transition: color 0.2s;
    }
    a.back-link:hover {
      color: var(--accent);
    }
    .header h1 {
      font-size: 2rem;
      margin-top: 0;
      margin-bottom: 2rem;
      letter-spacing: -0.025em;
    }
    .station {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .station h3 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1.1rem;
      color: var(--text-main);
    }
    audio {
      width: 100%;
      outline: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Live Radio Streams</h1>
    </div>

    <div class="station">
      <h3>BBC Radio Nottingham</h3>
      <!-- The source URL is handled by the script below for HLS streams -->
      <audio id="audio-nottingham" controls preload="none"></audio>
    </div>

    <div class="station">
      <h3>BBC Radio Leicester</h3>
      <!-- The source URL is handled by the script below for HLS streams -->
      <audio id="audio-leicester" controls preload="none"></audio>
    </div>

    <div class="station">
      <h3>Greatest Hits Radio</h3>
      <!-- Using Bauer's newer AAC edge server -->
      <audio controls preload="none">
        <source src="https://edge-bauermz-uk-live.planetradio.co.uk/net2national.aac" type="audio/aac">
      </audio>
    </div>

    <div class="station">
      <h3>Fosse 107</h3>
      <!-- Stays on your worker to bypass HTTP Mixed-Content blocks -->
      <audio controls preload="none">
        <source src="https://radio-proxy.alfie-hawkes2006.workers.dev/?station=fosse" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <!-- This script block connects the new BBC HLS streams to your audio players -->
  <script>
    function setupHlsStream(elementId, streamUrl) {
      const audio = document.getElementById(elementId);
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(audio);
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        // Fallback for Safari which natively supports HLS
        audio.src = streamUrl;
      }
    }

    setupHlsStream('audio-nottingham', 'https://lsn.lv/bbcradio.m3u8?station=bbc_radio_nottingham');
    setupHlsStream('audio-leicester', 'https://lsn.lv/bbcradio.m3u8?station=bbc_radio_leicester');
  </script>

</body>
</html>
