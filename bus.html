<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Bus Network | Hawkes House</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --bus-green: #22c55e;
      --bus-orange: #f97316;
    }
    
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    
    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    
    a.back-link:hover { color: var(--accent); }
    
    .header {
      margin-bottom: 1.5rem;
    }
    
    .header h1 {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: -0.025em;
    }
    
    .header h1 span { color: var(--accent); }
    .header p { color: var(--text-muted); margin-top: 0.25rem; }

    .map-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 550px;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      flex-grow: 1;
      border-radius: 8px;
      background-color: #0b1329;
    }

    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1.1rem;
      transition: opacity 0.5s;
    }

    .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background-color: var(--card-bg) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0;
    }
    .leaflet-popup-content {
      margin: 0;
      width: 260px !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: var(--text-muted);
      padding: 8px;
    }
    
    .schedule-header {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      border-top: 4px solid var(--accent);
    }
    .schedule-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
    }
    .schedule-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 4px 0 0 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .schedule-body {
      padding: 10px 15px 15px 15px;
    }
    .dep-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .dep-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .dep-dest {
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }
    .dep-line-badge {
      background-color: var(--border);
      color: var(--text-main);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      min-width: 24px;
      text-align: center;
    }
    .dep-time {
      color: var(--accent);
      font-weight: bold;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .dep-time.due {
      color: var(--bus-green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Bus <span>Network</span></h1>
      <p>Live NCT Departures: University West Gate & Victoria Centre</p>
    </div>

    <div class="map-card">
      <div id="loading-overlay">Syncing live network...</div>
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    const map = L.map('map', {
      zoomControl: false
    }).setView([52.945, -1.17], 13);

    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Exact street coordinates with the requested orange markers and NCT stop IDs
    const busStops = [
      { name: "Uni West Gate (UN24)", code: "3390UN24", lat: 52.93292, lon: -1.19830, color: "var(--bus-orange)" },
      { name: "Uni West Gate (UN23)", code: "3390UN23", lat: 52.93262, lon: -1.19885, color: "var(--bus-orange)" },
      { name: "Victoria Centre (J3)", code: "3390J3", lat: 52.95665, lon: -1.14652, color: "var(--bus-orange)" },
      { name: "Victoria Centre (J4)", code: "3390J4", lat: 52.95690, lon: -1.14612, color: "var(--bus-orange)" }
    ];

    async function initBusMap() {
      busStops.forEach(stop => {
        const marker = L.circleMarker([stop.lat, stop.lon], {
          radius: 7,
          fillColor: stop.color,
          color: "#0f172a",
          weight: 2,
          opacity: 1,
          fillOpacity: 1
        }).addTo(map);

        marker.bindPopup(`<div style="padding: 15px; text-align: center; color: var(--text-muted);">Fetching live telemetry...</div>`);

        marker.on('popupopen', async (e) => {
          const popup = e.popup;
          try {
            // Fetch directly from Simon Prickett's Cloudflare Worker
            const res = await fetch(`https://nctx.crudworks.workers.dev/?stopId=${stop.code}`);
            if (!res.ok) throw new Error("Worker returned status: " + res.status);
            
            // The worker parses the HTML and returns a direct JSON array
            const departures = await res.json();

            if (!Array.isArray(departures) || departures.length === 0) {
              popup.setContent(`
                <div class="schedule-header" style="border-top-color: ${stop.color};">
                  <p class="schedule-title">${stop.name}</p>
                  <p class="schedule-subtitle">Live Departures</p>
                </div>
                <div class="schedule-body" style="text-align: center; color: var(--text-muted); padding-top: 15px;">
                  No live departures currently listed.
                </div>
              `);
              return;
            }

            // Map fields natively from the worker's response schema
            let rowsHTML = departures.slice(0, 5).map(d => {
              const route = d.routeNumber || "Bus";
              const dest = d.destination || "City Centre";
              
              // Handle minute integers accurately
              const mins = d.expectedMins !== undefined ? d.expectedMins : 0;
              const displayTime = mins <= 0 ? "Due" : `${mins} min`;

              return `
                <div class="dep-row">
                  <div class="dep-dest" title="${route} - ${dest}">
                    <div class="dep-line-badge" style="background-color: ${stop.color}; color: #fff;">${route}</div>
                    ${dest}
                  </div>
                  <div class="dep-time ${displayTime === 'Due' ? 'due' : ''}">${displayTime}</div>
                </div>
              `;
            }).join('');

            popup.setContent(`
              <div class="schedule-header" style="border-top-color: ${stop.color};">
                <p class="schedule-title">${stop.name}</p>
                <p class="schedule-subtitle">Live Departures</p>
              </div>
              <div class="schedule-body">
                ${rowsHTML}
              </div>
            `);

          } catch (err) {
            console.error("Worker Proxy Error:", err);
            popup.setContent(`
              <div class="schedule-header" style="border-top-color: ${stop.color};">
                <p class="schedule-title">${stop.name}</p>
                <p class="schedule-subtitle">Live Departures</p>
              </div>
              <div class="schedule-body" style="text-align: center; color: var(--text-muted); padding-top: 15px;">
                Unable to retrieve network data.<br>
                <small style="opacity:0.4; font-size:0.75rem;">Check console for errors.</small>
              </div>
            `);
          }
        });
      });

      document.getElementById('loading-overlay').style.opacity = '0';
      setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 500);
    }

    initBusMap();
  </script>

</body>
</html>
