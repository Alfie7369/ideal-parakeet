<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Bus Network | Hawkes House</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --bus-green: #22c55e;
    }
    
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    
    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    
    a.back-link:hover { color: var(--accent); }
    
    .header {
      margin-bottom: 1.5rem;
    }
    
    .header h1 {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: -0.025em;
    }
    
    .header h1 span { color: var(--accent); }
    .header p { color: var(--text-muted); margin-top: 0.25rem; }

    .map-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 550px;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      flex-grow: 1;
      border-radius: 8px;
      background-color: #0b1329;
    }

    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1.1rem;
      transition: opacity 0.5s;
    }

    .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background-color: var(--card-bg) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0;
    }
    .leaflet-popup-content {
      margin: 0;
      width: 250px !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: var(--text-muted);
      padding: 8px;
    }
    
    .schedule-header {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      border-top: 4px solid var(--accent);
    }
    .schedule-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
    }
    .schedule-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 4px 0 0 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .schedule-body {
      padding: 10px 15px 15px 15px;
    }
    .dep-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .dep-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .dep-dest {
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }
    .dep-time {
      color: var(--accent);
      font-weight: bold;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .dep-time.due {
      color: var(--bus-green);
      animation: pulse 2s infinite;
    }
    .indicator {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background-color: var(--accent);
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Bus <span>Network</span></h1>
      <p>Live NCT Departures: University West Gate & Victoria Centre</p>
    </div>

    <div class="map-card">
      <div id="loading-overlay">Loading bus network...</div>
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    const map = L.map('map', {
      zoomControl: false
    }).setView([52.945, -1.16], 13);

    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Target Stops with NaPTAN ATCO codes for NCT API endpoint
    const busStops = [
      { name: "Uni West Gate (UN24)", code: "3300OW0124", lat: 52.9332, lon: -1.1982 },
      { name: "Uni West Gate (UN23)", code: "3300OW0123", lat: 52.9328, lon: -1.1989 },
      { name: "Victoria Centre (J3)", code: "3300IN03", lat: 52.9565, lon: -1.1465 },
      { name: "Victoria Centre (J4)", code: "3300IN04", lat: 52.9568, lon: -1.1461 }
    ];

    async function initBusMap() {
      busStops.forEach(stop => {
        const marker = L.circleMarker([stop.lat, stop.lon], {
          radius: 7,
          fillColor: "#38bdf8",
          color: "#0f172a",
          weight: 2,
          opacity: 1,
          fillOpacity: 1
        }).addTo(map);

        marker.bindPopup(`<div style="padding: 15px; text-align: center; color: var(--text-muted);">Fetching live departures...</div>`);

        marker.on('popupopen', async (e) => {
          const popup = e.popup;
          try {
            // Query ArcticAPI visits endpoint directly
            const res = await fetch(`https://nctx.arcticapi.com/network/stops/${stop.code}/visits`);
            
            if (!res.ok) {
              throw new Error("API request failed");
            }

            const data = await res.json();
            let visits = data.visits || data || [];
            
            if (!Array.isArray(visits) || visits.length === 0) {
              popup.setContent(`
                <div class="schedule-header">
                  <p class="schedule-title">${stop.name}</p>
                  <p class="schedule-subtitle">Live Departures</p>
                </div>
                <div class="schedule-body" style="text-align: center; color: var(--text-muted); padding-top: 15px;">
                  No live departures available.
                </div>
              `);
              return;
            }

            let rowsHTML = visits.slice(0, 5).map(v => {
              const line = v.lineName || v.line || "Bus";
              const dest = v.destinationName || v.destination || "City Centre";
              const expectedTime = v.expectedDepartureTime || v.aimedDepartureTime;

              let displayTime = "Due";
              if (expectedTime) {
                const now = new Date();
                const depTime = new Date(expectedTime);
                let diffMins = Math.round((depTime - now) / 60000);
                if (diffMins < 0) diffMins = 0;
                displayTime = diffMins <= 1 ? "Due" : `${diffMins} min`;
              }

              return `
                <div class="dep-row">
                  <div class="dep-dest" title="${line} - ${dest}">
                    <div class="indicator"></div>
                    <strong>${line}</strong> ${dest}
                  </div>
                  <div class="dep-time ${displayTime === 'Due' ? 'due' : ''}">${displayTime}</div>
                </div>
              `;
            }).join('');

            popup.setContent(`
              <div class="schedule-header">
                <p class="schedule-title">${stop.name}</p>
                <p class="schedule-subtitle">Live Departures</p>
              </div>
              <div class="schedule-body">
                ${rowsHTML}
              </div>
            `);

          } catch (err) {
            console.error("ArcticAPI Error:", err);
            popup.setContent(`<div style="padding: 20px; text-align: center; color: var(--text-muted);">Failed to retrieve live telemetry.</div>`);
          }
        });
      });

      document.getElementById('loading-overlay').style.opacity = '0';
      setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 500);
    }

    initBusMap();
  </script>

</body>
</html>
