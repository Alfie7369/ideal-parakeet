<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Nottingham Live Departures | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 650px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .board {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .train-row {
      display: flex;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      align-items: center;
      transition: background-color 0.2s;
    }
    .train-row:last-child { border-bottom: none; }
    .train-row:hover { background-color: rgba(255,255,255,0.02); }
    
    .time-col {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent);
      width: 70px;
      flex-shrink: 0;
    }
    .dest-col {
      flex: 1;
      padding-right: 1rem;
    }
    .dest-col h3 { margin: 0 0 0.25rem 0; font-size: 1.05rem; }
    .dest-col p { margin: 0; font-size: 0.85rem; color: var(--text-muted); }
    
    .plat-col {
      width: 50px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-main);
    }
    
    .status-col {
      width: 90px;
      text-align: right;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .status-ontime { color: var(--success); }
    .status-delayed { color: var(--danger); }
    
    .loading { padding: 2rem; text-align: center; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Nottingham <span>Departures</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">Live National Rail Feed</p>
    </div>

    <div class="board" id="departure-board">
      <div class="loading">Fetching live trains...</div>
    </div>
  </div>

  <script>
    async function fetchTrains() {
      const board = document.getElementById('departure-board');
      try {
        // Fetch next 10 departures from Nottingham (NOT)
        const response = await fetch('https://huxley2.azurewebsites.net/departures/NOT/10');
        const data = await response.json();
        
        if (!data.trainServices || data.trainServices.length === 0) {
          board.innerHTML = '<div class="loading">No services currently running.</div>';
          return;
        }

        board.innerHTML = ''; // Clear loading text

        data.trainServices.forEach(train => {
          const row = document.createElement('div');
          row.className = 'train-row';
          
          const destination = train.destination[0].locationName;
          const std = train.std; // Scheduled Time of Departure
          const etd = train.etd; // Estimated Time of Departure
          const platform = train.platform || '-';
          const operator = train.operator;

          // Determine status color
          let statusClass = 'status-delayed';
          if (etd === 'On time') {
            statusClass = 'status-ontime';
          }

          row.innerHTML = `
            <div class="time-col">${std}</div>
            <div class="dest-col">
              <h3>${destination}</h3>
              <p>${operator}</p>
            </div>
            <div class="plat-col">${platform}</div>
            <div class="status-col ${statusClass}">${etd}</div>
          `;
          
          board.appendChild(row);
        });

      } catch (error) {
        board.innerHTML = '<div class="loading" style="color: var(--danger);">Failed to load departure data.</div>';
        console.error("Error fetching train data:", error);
      }
    }

    // Load trains immediately, then refresh every 60 seconds
    fetchTrains();
    setInterval(fetchTrains, 60000);
  </script>

</body>
</html>
