<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Live Rail Departures | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 1400px; 
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .boards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: start;
    }
    @media (max-width: 1000px) {
      .boards-grid { grid-template-columns: 1fr; }
    }
    
    .board-column h2 {
      font-size: 1.5rem;
      margin: 0 0 1rem 0;
    }
    
    .board {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .train-row {
      display: flex;
      flex-direction: column;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s;
    }
    .train-row:last-child { border-bottom: none; }
    .train-row:hover { background-color: rgba(255,255,255,0.02); }
    
    .main-info {
      display: flex;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    
    .time-col {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent);
      width: 70px;
      flex-shrink: 0;
    }
    .dest-col {
      flex: 1;
      padding-right: 1rem;
    }
    .dest-col h3 { margin: 0; font-size: 1.1rem; letter-spacing: 0.02em; }
    
    .plat-col {
      width: 60px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-main);
    }
    
    .status-col {
      width: 100px;
      text-align: right;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .status-ontime { color: var(--success); }
    .status-delayed { color: var(--warning); }
    .status-cancelled { color: var(--danger); text-decoration: line-through; }
    
    .sub-info {
      display: flex;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-left: 70px;
      gap: 1rem;
    }
    .calling-at {
      flex: 1;
      white-space: normal;
      line-height: 1.4;
      padding-right: 1rem;
    }
    .operator {
      flex-shrink: 0;
      opacity: 0.8;
    }
    
    .loading { padding: 2rem; text-align: center; color: var(--text-muted); }

    /* Custom Search Styling */
    .custom-row {
      grid-column: 1 / -1; /* Makes the custom board span the full width */
      margin-top: 1rem;
    }
    .custom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .search-box {
      display: flex;
      gap: 0.5rem;
    }
    .search-box input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      width: 150px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .search-box button:hover { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Live <span>Departures</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">National Rail Open Data</p>
    </div>

    <div class="boards-grid">
      <!-- Nottingham Board -->
      <div class="board-column">
        <h2>Nottingham</h2>
        <div class="board" id="board-NOT">
          <div class="loading">Fetching live trains...</div>
        </div>
      </div>
      
      <!-- Tamworth Board -->
      <div class="board-column">
        <h2>Tamworth</h2>
        <div class="board" id="board-TAM">
          <div class="loading">Fetching live trains...</div>
        </div>
      </div>

      <!-- Dynamic Search Board -->
      <div class="board-column custom-row">
        <div class="custom-header">
          <h2 id="custom-title">Station Search</h2>
          <div class="search-box">
            <input type="text" id="crs-input" placeholder="e.g. SHF" maxlength="3">
            <button onclick="searchCustomStation()">Load</button>
          </div>
        </div>
        <div class="board" id="board-CUSTOM">
          <div class="loading">Enter a 3-letter station code to view live departures.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeCustomCrs = null;

    async function fetchTrains(stationCode, boardId) {
      const board = document.getElementById(boardId);
      try {
        const response = await fetch(`https://huxley2.azurewebsites.net/departures/${stationCode}/10?expand=true`);
        const data = await response.json();

        // If the station exists but has no trains, or the code was slightly invalid and returned no services
        if (!data.trainServices || data.trainServices.length === 0) {
          board.innerHTML = '<div class="loading">No services currently running or invalid station code.</div>';
          return;
        }

        board.innerHTML = ''; 

        // Update the dynamic title if this is the custom board
        if (boardId === 'board-CUSTOM' && data.locationName) {
          document.getElementById('custom-title').textContent = data.locationName;
        }

        data.trainServices.forEach(train => {
          const row = document.createElement('div');
          row.className = 'train-row';

          const destination = train.destination[0].locationName;
          const std = train.std; 
          const etd = train.etd; 
          const platform = train.platform || '-';
          const operator = train.operator;
          const isCancelled = train.isCancelled;

          let callingText = '';
          if (train.subsequentCallingPoints && train.subsequentCallingPoints.length > 0) {
            const pointsArray = train.subsequentCallingPoints[0].callingPoint.map(cp => cp.locationName);
            callingText = `Calling at: ${pointsArray.join(', ')}`;
          } else {
            callingText = 'This train is at its destination.';
          }





          let statusClass = 'status-delayed';
          let statusText = etd;

          if (isCancelled) {
            statusClass = 'status-cancelled';
            statusText = 'Cancelled';
            callingText = train.cancelReason || 'Service cancelled.';
          } else if (etd === 'On time') {
            statusClass = 'status-ontime';
          }

          const mainInfo = `
            <div class="main-info">
              <div class="time-col">${std}</div>
              <div class="dest-col">
                <h3>${destination}</h3>
              </div>
              <div class="plat-col">${platform}</div>
              <div class="status-col ${statusClass}">${statusText}</div>
            </div>
          `;

          const subInfo = `
            <div class="sub-info">
              <div class="calling-at">${callingText}</div>
              <div class="operator">${operator}</div>
            </div>
          `;
          
          row.innerHTML = mainInfo + subInfo;
          board.appendChild(row);
        });

      } catch (error) {
        board.innerHTML = '<div class="loading" style="color: var(--danger);">Failed to load Open Data feed. Ensure CRS is valid.</div>';
        console.error(`Error fetching train data for ${stationCode}:`, error);
      }
    }

    function searchCustomStation() {
      const input = document.getElementById('crs-input').value.toUpperCase().trim();
      if (input.length === 3) {
        activeCustomCrs = input;
        document.getElementById('board-CUSTOM').innerHTML = '<div class="loading">Fetching live trains...</div>';
        fetchTrains(activeCustomCrs, 'board-CUSTOM');
      }
    }

    // Allow pressing "Enter" inside the text box to trigger the search
    document.getElementById('crs-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        searchCustomStation();
      }
    });

    function updateAllBoards() {
      fetchTrains('NOT', 'board-NOT');
      fetchTrains('TAM', 'board-TAM');
      if (activeCustomCrs) {
        fetchTrains(activeCustomCrs, 'board-CUSTOM');


      }
    }

    updateAllBoards();
    setInterval(updateAllBoards, 60000);
    
  </script>

</body>
</html>
