<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Weaver Line Map | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --weaver-maroon: #9B0058;
      --train-bg: #f59e0b;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 950px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--text-main); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--weaver-maroon); }
    
    .board {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    .loading { text-align: center; color: var(--text-muted); margin-bottom: 1rem; }

    /* SVG Map Styling */
    svg {
      width: 100%;
      height: auto;
      max-height: 700px;
    }
    .tfl-line {
      fill: none;
      stroke: var(--weaver-maroon);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .station-dot {
      fill: var(--card-bg);
      stroke: var(--weaver-maroon);
      stroke-width: 3.5;
      r: 5;
      transition: transform 0.2s;
    }
    .station-dot.interchange {
      fill: var(--weaver-maroon);
      stroke: var(--text-main);
      stroke-width: 3;
      r: 6;
    }
    .station-label {
      fill: var(--text-main);
      font-size: 11px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
    }
    .station-label.interchange {
      font-weight: bold;
    }

    /* Live Train Markers on SVG */
    .train-marker {
      cursor: pointer;
    }
    .train-bubble {
      fill: var(--train-bg);
      rx: 4;
      ry: 4;
    }
    .train-text {
      fill: var(--bg);
      font-size: 10px;
      font-weight: bold;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>London <span>Overground</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">Official Schematic Map Layout (Weaver Line)</p>
    </div>

    <div class="board">
      <div id="status-text" class="loading">Generating schematic and connecting to TfL API...</div>
      
      <!-- SVG Tube Map -->
      <svg viewBox="0 0 800 850" id="tfl-map">
        <!-- Lines (Weaver Line Maroon Paths) -->
        <!-- Cheshunt Branch -->
        <path class="tfl-line" d="M 150 50 L 250 100 L 250 150" />
        <!-- Enfield Branch -->
        <path class="tfl-line" d="M 350 100 L 250 150" />
        <!-- Trunk down through Seven Sisters and Hackney Downs -->
        <path class="tfl-line" d="M 250 150 L 250 450 L 350 550 L 350 720" />
        
        <!-- Chingford Branch -->
        <path class="tfl-line" d="M 600 80 L 500 130 L 500 200 L 400 300 L 350 350 L 350 550" />

        <!-- Stations Grouped with Coordinates -->
        <g id="station-nodes">
          <!-- Cheshunt Branch -->
          <circle class="station-dot interchange" cx="150" cy="50" data-station="Cheshunt"></circle>
          <text class="station-label interchange" x="165" y="54" data-station="Cheshunt">Cheshunt</text>

          <circle class="station-dot" cx="200" cy="75" data-station="Theobalds Grove"></circle>
          <text class="station-label" x="215" y="79" data-station="Theobalds Grove">Theobalds Grove</text>

          <circle class="station-dot" cx="250" cy="100" data-station="Turkey Street"></circle>
          <text class="station-label" x="265" y="104" data-station="Turkey Street">Turkey Street</text>

          <!-- Enfield Branch -->
          <circle class="station-dot" cx="350" cy="100" data-station="Enfield Town"></circle>
          <text class="station-label" x="300" y="85" data-station="Enfield Town">Enfield Town</text>

          <circle class="station-dot" cx="300" cy="125" data-station="Bush Hill Park"></circle>
          <text class="station-label" x="315" y="129" data-station="Bush Hill Park">Bush Hill Park</text>

          <!-- Edmonton Green junction area -->
          <circle class="station-dot interchange" cx="250" cy="150" data-station="Edmonton Green"></circle>
          <text class="station-label interchange" x="140" y="154" data-station="Edmonton Green">Edmonton Green</text>

          <circle class="station-dot" cx="250" cy="200" data-station="Silver Street"></circle>
          <text class="station-label" x="265" y="204" data-station="Silver Street">Silver Street</text>

          <circle class="station-dot" cx="250" cy="250" data-station="White Hart Lane"></circle>
          <text class="station-label" x="265" y="254" data-station="White Hart Lane">White Hart Lane</text>

          <circle class="station-dot" cx="250" cy="300" data-station="Bruce Grove"></circle>
          <text class="station-label" x="265" y="304" data-station="Bruce Grove">Bruce Grove</text>

          <circle class="station-dot interchange" cx="250" cy="350" data-station="Seven Sisters"></circle>
          <text class="station-label interchange" x="160" y="354" data-station="Seven Sisters">Seven Sisters</text>

          <circle class="station-dot" cx="250" cy="390" data-station="Stamford Hill"></circle>
          <text class="station-label" x="265" y="394" data-station="Stamford Hill">Stamford Hill</text>

          <circle class="station-dot" cx="250" cy="420" data-station="Stoke Newington"></circle>
          <text class="station-label" x="265" y="424" data-station="Stoke Newington">Stoke Newington</text>

          <circle class="station-dot" cx="250" cy="450" data-station="Rectory Road"></circle>
          <text class="station-label" x="265" y="454" data-station="Rectory Road">Rectory Road</text>

          <!-- Hackney Downs (Interchange with Chingford branch) -->
          <circle class="station-dot interchange" cx="350" cy="550" data-station="Hackney Downs"></circle>
          <text class="station-label interchange" x="370" y="554" data-station="Hackney Downs">Hackney Downs</text>

          <!-- Chingford Branch Stations -->
          <circle class="station-dot" cx="600" cy="80" data-station="Chingford"></circle>
          <text class="station-label" x="615" y="84" data-station="Chingford">Chingford</text>

          <circle class="station-dot" cx="550" cy="105" data-station="Highams Park"></circle>
          <text class="station-label" x="565" y="109" data-station="Highams Park">Highams Park</text>

          <circle class="station-dot" cx="500" cy="130" data-station="Wood Street"></circle>
          <text class="station-label" x="515" y="134" data-station="Wood Street">Wood Street</text>

          <circle class="station-dot interchange" cx="500" cy="200" data-station="Walthamstow Central"></circle>
          <text class="station-label interchange" x="520" y="204" data-station="Walthamstow Central">Walthamstow Central</text>

          <circle class="station-dot" cx="450" cy="250" data-station="St James Street"></circle>
          <text class="station-label" x="360" y="250" data-station="St James Street">St James Street</text>

          <circle class="station-dot" cx="400" cy="300" data-station="Clapton"></circle>
          <text class="station-label" x="415" y="304" data-station="Clapton">Clapton</text>

          <!-- Southern Trunk towards Liverpool Street -->
          <circle class="station-dot" cx="350" cy="590" data-station="London Fields"></circle>
          <text class="station-label" x="365" y="594" data-station="London Fields">London Fields</text>

          <circle class="station-dot" cx="350" cy="630" data-station="Cambridge Heath"></circle>
          <text class="station-label" x="365" y="634" data-station="Cambridge Heath">Cambridge Heath</text>

          <circle class="station-dot" cx="350" cy="670" data-station="Bethnal Green"></circle>
          <text class="station-label" x="260" y="670" data-station="Bethnal Green">Bethnal Green</text>

          <circle class="station-dot interchange" cx="350" cy="720" data-station="London Liverpool Street"></circle>
          <text class="station-label interchange" x="370" y="724" data-station="London Liverpool Street">Liverpool Street</text>
        </g>

        <!-- Live Train Badges Container -->
        <g id="train-markers"></g>
      </svg>
    </div>
  </div>

  <script>
    async function fetchLiveTrains() {
      try {
        const response = await fetch('https://api.tfl.gov.uk/Line/weaver/Arrivals');
        const data = await response.json();
        
        const markerGroup = document.getElementById('train-markers');
        markerGroup.innerHTML = ''; // Clear old badges

        const trainsByVehicle = {};

        // Filter to find the nearest physical station for each train
        data.forEach(arrival => {
          const cleanStationName = arrival.stationName.replace(' Rail Station', '').replace(' (London)', '').trim();
          if (!trainsByVehicle[arrival.vehicleId] || arrival.timeToStation < trainsByVehicle[arrival.vehicleId].timeToStation) {
            trainsByVehicle[arrival.vehicleId] = {
              station: cleanStationName,
              timeToStation: arrival.timeToStation
            };
          }
        });

        let mappedCount = 0;
        const stationCounts = {};

        Object.values(trainsByVehicle).forEach(train => {
          // Find the matching station circle element in the SVG
          const stationNode = document.querySelector(`circle[data-station="${train.station}"]`);
          
          if (stationNode) {
            const cx = parseFloat(stationNode.getAttribute('cx'));
            const cy = parseFloat(stationNode.getAttribute('cy'));

            stationCounts[train.station] = (stationCounts[train.station] || 0) + 1;
            const offset = (stationCounts[train.station] - 1) * 38;

            const mins = Math.round(train.timeToStation / 60);
            const textContent = mins === 0 ? 'Due' : `${mins}m`;

            // Create an SVG group for the train indicator bubble
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'train-marker');
            
            // Position the marker nicely to the right/top of the station dot
            const posX = cx + 18 + offset;
            const posY = cy - 6;

            g.innerHTML = `
              <rect class="train-bubble" x="${posX}" y="${posY}" width="34" height="16"></rect>
              <text class="train-text" x="${posX + 5}" y="${posY + 12}">${textContent}</text>
            `;

            markerGroup.appendChild(g);
            mappedCount++;
          }
        });

        document.getElementById('status-text').textContent = `Live Map Active: ${mappedCount} trains positioned on schematic.`;
        document.getElementById('status-text').style.color = 'var(--text-muted)';

      } catch (error) {
        document.getElementById('status-text').textContent = "Failed to load live TfL schematic data.";
        document.getElementById('status-text').style.color = "var(--train-bg)";
        console.error(error);
      }
    }

    fetchLiveTrains();
    setInterval(fetchLiveTrains, 30000);
  </script>

</body>
</html>
