<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Weaver Line Map | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --weaver-maroon: #9B0058;
      --train-bg: #f59e0b;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 1000px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--text-main); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--weaver-maroon); }
    
    .board {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    .loading { text-align: center; color: var(--text-muted); margin-bottom: 1rem; }

    /* SVG Map Styling */
    svg {
      width: 100%;
      height: auto;
      max-height: 750px;
    }
    .tfl-line {
      fill: none;
      stroke: var(--weaver-maroon);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .station-dot {
      fill: var(--card-bg);
      stroke: var(--weaver-maroon);
      stroke-width: 3;
      r: 4.5;
    }
    .station-dot.interchange {
      fill: var(--weaver-maroon);
      stroke: var(--text-main);
      stroke-width: 2.5;
      r: 5.5;
    }
    .station-label {
      fill: var(--text-main);
      font-size: 10.5px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
    }
    .station-label.interchange {
      font-weight: bold;
    }

    /* Live Train Markers */
    .train-bubble {
      fill: var(--train-bg);
      rx: 3;
      ry: 3;
    }
    .train-text {
      fill: var(--bg);
      font-size: 9.5px;
      font-weight: bold;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>London <span>Overground</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">Weaver Line Schematic Layout</p>
    </div>

    <div class="board">
      <div id="status-text" class="loading">Generating schematic and connecting to TfL API...</div>
      
      <!-- Corrected SVG Topology Map -->
      <svg viewBox="0 0 900 850" id="tfl-map">
        <!-- Lines (Weaver Line Maroon Paths matching official geometry) -->
        <!-- Cheshunt & Enfield Northern Branches converging at Edmonton Green -->
        <path class="tfl-line" d="M 200 50 L 300 100 L 300 160" />
        <path class="tfl-line" d="M 400 100 L 300 160" />
        
        <!-- Western Branch down through Seven Sisters to Hackney Downs -->
        <path class="tfl-line" d="M 300 160 L 300 480 L 400 560" />
        
        <!-- Chingford Branch running down the right side into Hackney Downs -->
        <path class="tfl-line" d="M 650 80 L 550 160 L 550 350 L 400 560" />

        <!-- Southern Trunk down to Liverpool Street -->
        <path class="tfl-line" d="M 400 560 L 400 740" />

        <!-- Stations Grouped with Corrected Grid Coordinates -->
        <g id="station-nodes">
          <!-- Cheshunt Branch -->
          <circle class="station-dot interchange" cx="200" cy="50" data-station="Cheshunt"></circle>
          <text class="station-label interchange" x="120" y="54" data-station="Cheshunt">Cheshunt</text>

          <circle class="station-dot" cx="250" cy="75" data-station="Theobalds Grove"></circle>
          <text class="station-label" x="145" y="79" data-station="Theobalds Grove">Theobalds Grove</text>

          <circle class="station-dot" cx="300" cy="100" data-station="Turkey Street"></circle>
          <text class="station-label" x="210" y="104" data-station="Turkey Street">Turkey Street</text>

          <!-- Enfield Branch -->
          <circle class="station-dot" cx="400" cy="100" data-station="Enfield Town"></circle>
          <text class="station-label" x="415" y="104" data-station="Enfield Town">Enfield Town</text>

          <circle class="station-dot" cx="350" cy="130" data-station="Bush Hill Park"></circle>
          <text class="station-label" x="365" y="134" data-station="Bush Hill Park">Bush Hill Park</text>

          <!-- Edmonton Green (Convergence) -->
          <circle class="station-dot interchange" cx="300" cy="160" data-station="Edmonton Green"></circle>
          <text class="station-label interchange" x="185" y="164" data-station="Edmonton Green">Edmonton Green</text>

          <!-- Down through Tottenham -->
          <circle class="station-dot" cx="300" cy="210" data-station="Silver Street"></circle>
          <text class="station-label" x="315" y="214" data-station="Silver Street">Silver Street</text>

          <circle class="station-dot" cx="300" cy="260" data-station="White Hart Lane"></circle>
          <text class="station-label" x="315" y="264" data-station="White Hart Lane">White Hart Lane</text>

          <circle class="station-dot" cx="300" cy="310" data-station="Bruce Grove"></circle>
          <text class="station-label" x="315" y="314" data-station="Bruce Grove">Bruce Grove</text>

          <circle class="station-dot interchange" cx="300" cy="360" data-station="Seven Sisters"></circle>
          <text class="station-label interchange" x="205" y="364" data-station="Seven Sisters">Seven Sisters</text>

          <circle class="station-dot" cx="300" cy="400" data-station="Stamford Hill"></circle>
          <text class="station-label" x="315" y="404" data-station="Stamford Hill">Stamford Hill</text>

          <circle class="station-dot" cx="300" cy="435" data-station="Stoke Newington"></circle>
          <text class="station-label" x="315" y="439" data-station="Stoke Newington">Stoke Newington</text>

          <circle class="station-dot" cx="300" cy="470" data-station="Rectory Road"></circle>
          <text class="station-label" x="315" y="474" data-station="Rectory Road">Rectory Road</text>

          <!-- Chingford Branch (Right Side) -->
          <circle class="station-dot" cx="650" cy="80" data-station="Chingford"></circle>
          <text class="station-label" x="665" y="84" data-station="Chingford">Chingford</text>

          <circle class="station-dot" cx="600" cy="120" data-station="Highams Park"></circle>
          <text class="station-label" x="615" y="124" data-station="Highams Park">Highams Park</text>

          <circle class="station-dot" cx="550" cy="160" data-station="Wood Street"></circle>
          <text class="station-label" x="565" y="164" data-station="Wood Street">Wood Street</text>

          <circle class="station-dot interchange" cx="550" cy="230" data-station="Walthamstow Central"></circle>
          <text class="station-label interchange" x="570" y="234" data-station="Walthamstow Central">Walthamstow Central</text>

          <circle class="station-dot" cx="500" cy="280" data-station="St James Street"></circle>
          <text class="station-label" x="410" y="280" data-station="St James Street">St James Street</text>

          <circle class="station-dot" cx="450" cy="330" data-station="Clapton"></circle>
          <text class="station-label" x="465" y="334" data-station="Clapton">Clapton</text>

          <!-- Hackney Downs (Major Interchange where branches meet) -->
          <circle class="station-dot interchange" cx="400" cy="560" data-station="Hackney Downs"></circle>
          <text class="station-label interchange" x="420" y="564" data-station="Hackney Downs">Hackney Downs</text>

          <!-- Southern Trunk to Liverpool Street -->
          <circle class="station-dot" cx="400" cy="610" data-station="London Fields"></circle>
          <text class="station-label" x="415" y="614" data-station="London Fields">London Fields</text>

          <circle class="station-dot" cx="400" cy="650" data-station="Cambridge Heath"></circle>
          <text class="station-label" x="415" y="654" data-station="Cambridge Heath">Cambridge Heath</text>

          <circle class="station-dot" cx="400" cy="690" data-station="Bethnal Green"></circle>
          <text class="station-label" x="310" y="690" data-station="Bethnal Green">Bethnal Green</text>

          <circle class="station-dot interchange" cx="400" cy="740" data-station="London Liverpool Street"></circle>
          <text class="station-label interchange" x="420" y="744" data-station="London Liverpool Street">Liverpool Street</text>
        </g>

        <!-- Live Train Markers -->
        <g id="train-markers"></g>
      </svg>
    </div>
  </div>

  <script>
    async function fetchLiveTrains() {
      try {
        const response = await fetch('https://api.tfl.gov.uk/Line/weaver/Arrivals');
        const data = await response.json();
        
        const markerGroup = document.getElementById('train-markers');
        markerGroup.innerHTML = ''; 

        const trainsByVehicle = {};

        data.forEach(arrival => {
          const cleanStationName = arrival.stationName.replace(' Rail Station', '').replace(' (London)', '').trim();
          
          if (arrival.timeToStation <= 900) {
            if (!trainsByVehicle[arrival.vehicleId] || arrival.timeToStation < trainsByVehicle[arrival.vehicleId].timeToStation) {
              trainsByVehicle[arrival.vehicleId] = {
                station: cleanStationName,
                timeToStation: arrival.timeToStation
              };
            }
          }
        });

        let mappedCount = 0;
        const stationCounts = {};

        Object.values(trainsByVehicle).forEach(train => {
          const stationNode = document.querySelector(`circle[data-station="${train.station}"]`);
          
          if (stationNode) {
            stationCounts[train.station] = (stationCounts[train.station] || 0) + 1;
            if (stationCounts[train.station] > 2) return; 

            const cx = parseFloat(stationNode.getAttribute('cx'));
            const cy = parseFloat(stationNode.getAttribute('cy'));

            const offset = (stationCounts[train.station] - 1) * 36;
            const mins = Math.round(train.timeToStation / 60);
            const textContent = mins === 0 ? 'Due' : `${mins}m`;

            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'train-marker');
            
            const posX = cx + 14 + offset;
            const posY = cy - 5;

            g.innerHTML = `
              <rect class="train-bubble" x="${posX}" y="${posY}" width="32" height="15"></rect>
              <text class="train-text" x="${posX + 4}" y="${posY + 11}">${textContent}</text>
            `;

            markerGroup.appendChild(g);
            mappedCount++;
          }
        });

        document.getElementById('status-text').textContent = `Live Map Active: Showing ${mappedCount} upcoming trains.`;
        document.getElementById('status-text').style.color = 'var(--text-muted)';

      } catch (error) {
        document.getElementById('status-text').textContent = "Failed to load live TfL schematic data.";
        document.getElementById('status-text').style.color = "var(--train-bg)";
        console.error(error);
      }
    }

    fetchLiveTrains();
    setInterval(fetchLiveTrains, 30000);
  </script>

</body>
</html>
