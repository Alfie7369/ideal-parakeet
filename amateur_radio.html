<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Radio Propagation | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      
      /* Terminal Colors */
      --term-bg: #020617;
      --term-green: #22c55e;
      --term-yellow: #eab308;
      --term-red: #ef4444;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 1000px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .boards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: start;
    }
    @media (max-width: 800px) {
      .boards-grid { grid-template-columns: 1fr; }
    }
    
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }
    .card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* Terminal UI */
    .terminal-screen {
      background-color: var(--term-bg);
      padding: 1.5rem;
      font-family: 'Courier New', Courier, monospace;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    /* Space Weather Metrics */
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .metric-row:last-child { margin-bottom: 0; }
    .metric-label {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metric-value {
      font-size: 2.5rem;
      font-weight: bold;
    }
    
    /* HF Bands Table */
    .band-row {
      display: flex;
      justify-content: space-between;
      padding: 0.8rem 0;
      border-bottom: 1px dashed var(--border);
      font-size: 1.1rem;
    }
    .band-row:last-child { border-bottom: none; }
    .band-name {
      font-weight: bold;
      color: var(--text-main);
    }
    
    /* Dynamic Status Colors */
    .status-good { color: var(--term-green); text-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }
    .status-fair { color: var(--term-yellow); text-shadow: 0 0 8px rgba(234, 179, 8, 0.4); }
    .status-poor { color: var(--term-red); text-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }

    .update-time {
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 0.75rem 1.5rem;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      text-align: right;
    }

    .loading { text-align: center; color: var(--text-muted); padding: 2rem; font-family: 'Courier New', Courier, monospace; }
  </style>
</head>
<body>
