<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Radio Propagation | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      
      /* Terminal Colors */
      --term-bg: #020617;
      --term-green: #22c55e;
      --term-yellow: #eab308;
      --term-red: #ef4444;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 1000px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .boards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: start;
    }
    @media (max-width: 800px) {
      .boards-grid { grid-template-columns: 1fr; }
    }
    
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }
    .card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* Terminal UI */
    .terminal-screen {
      background-color: var(--term-bg);
      padding: 1.5rem;
      font-family: 'Courier New', Courier, monospace;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    /* Space Weather Metrics */
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .metric-row:last-child { margin-bottom: 0; }
    .metric-label {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metric-value {
      font-size: 2.5rem;
      font-weight: bold;
    }
    
    /* HF Bands Table */
    .band-row {
      display: flex;
      justify-content: space-between;
      padding: 0.8rem 0;
      border-bottom: 1px dashed var(--border);
      font-size: 1.1rem;
    }
    .band-row:last-child { border-bottom: none; }
    .band-name {
      font-weight: bold;
      color: var(--text-main);
    }
    
    /* Dynamic Status Colors */
    .status-good { color: var(--term-green); text-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }
    .status-fair { color: var(--term-yellow); text-shadow: 0 0 8px rgba(234, 179, 8, 0.4); }
    .status-poor { color: var(--term-red); text-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }

    .update-time {
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 0.75rem 1.5rem;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      text-align: right;
    }

    .loading { text-align: center; color: var(--text-muted); padding: 2rem; font-family: 'Courier New', Courier, monospace; }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Radio <span>Propagation</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">Live NOAA SWPC Data & HF Conditions</p>
    </div>

    <div class="boards-grid">
      <!-- Space Weather Card -->
      <div class="card">
        <div class="card-header">
          Space Weather
          <span style="font-size: 0.85rem; font-weight: normal; color: var(--text-muted);">NOAA Real-time</span>
        </div>
        <div class="terminal-screen" id="swpc-data">
          <div class="loading">CONNECTING TO SWPC...</div>
        </div>
        <div class="update-time" id="swpc-time">Last update: --:--</div>
      </div>
      
      <!-- HF Bands Card -->
      <div class="card">
        <div class="card-header">
          Live HF Conditions
          <span style="font-size: 0.85rem; font-weight: normal; color: var(--text-muted);" id="local-time-indicator">Calculating...</span>
        </div>
        <div class="terminal-screen" id="hf-bands">
          <div class="loading">AWAITING KP INDEX...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function calculateHFBands(kpIndex) {
      const hour = new Date().getHours();
      const isDay = hour >= 7 && hour < 19;

      document.getElementById('local-time-indicator').textContent = isDay ? 'Daytime Propagation' : 'Nighttime Propagation';

      const bands = [
        { name: "80m (3.5 MHz)", dayBase: "Poor", nightBase: "Good" },
        { name: "40m (7 MHz)",   dayBase: "Fair", nightBase: "Good" },
        { name: "30m (10 MHz)",  dayBase: "Good", nightBase: "Fair" },
        { name: "20m (14 MHz)",  dayBase: "Good", nightBase: "Fair" },
        { name: "15m (21 MHz)",  dayBase: "Good", nightBase: "Poor" },
        { name: "10m (28 MHz)",  dayBase: "Fair", nightBase: "Poor" }
      ];

      const hfContainer = document.getElementById('hf-bands');
      hfContainer.innerHTML = '';

      bands.forEach(band => {
        let status = isDay ? band.dayBase : band.nightBase;

        if (kpIndex >= 4) {
          if (status === "Good") status = "Fair";
          else if (status === "Fair") status = "Poor";
        }
        if (kpIndex >= 6) {
          status = "Poor";
        }

        let statusClass = "status-poor";
        if (status === "Good") statusClass = "status-good";
        if (status === "Fair") statusClass = "status-fair";

        const row = document.createElement('div');
        row.className = 'band-row';
        row.innerHTML = `
          <div class="band-name">${band.name}</div>
          <div class="${statusClass}">[ ${status.toUpperCase()} ]</div>
        `;
        hfContainer.appendChild(row);
      });
    }

    async function fetchSpaceWeather() {
      try {
        const response = await fetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json');
        const data = await response.json();

        // Safe filtering to prevent NaN and undefined array crashes
        const validData = data.filter((row, index) => index > 0 && row.length > 1 && !isNaN(parseFloat(row[1])));
        const latestData = validData[validData.length - 1];
        
        const kpIndex = parseFloat(latestData[1]);
        
        // Strict ISO formatting for the timestamp
        const timeString = latestData[0].replace(' ', 'T');
        const timestamp = new Date(timeString + "Z");

        let stormLevel = "QUIET";
        let stormClass = "status-good";

        if (kpIndex >= 4 && kpIndex < 5) {
          stormLevel = "UNSETTLED";
          stormClass = "status-fair";
        } else if (kpIndex >= 5) {
          stormLevel = "STORM (G" + (Math.floor(kpIndex) - 4) + ")";
          stormClass = "status-poor";
        }

        document.getElementById('swpc-data').innerHTML = `
          <div class="metric-row">
            <div class="metric-label">Planetary K-Index</div>
            <div class="metric-value ${stormClass}">Kp ${kpIndex.toFixed(2)}</div>
          </div>
          <div class="metric-row" style="margin-top: 1.5rem;">
            <div class="metric-label">Geomagnetic Field</div>
            <div class="metric-value ${stormClass}" style="font-size: 1.8rem;">${stormLevel}</div>
          </div>
        `;

        document.getElementById('swpc-time').textContent = `Last NOAA update: ${timestamp.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;

        calculateHFBands(kpIndex);

      } catch (error) {
        console.error("Failed to load SWPC data:", error);
        document.getElementById('swpc-data').innerHTML = '<div class="loading status-poor">NOAA FEED OFFLINE</div>';
      }
    }

    fetchSpaceWeather();
    setInterval(fetchSpaceWeather, 900000); 
  </script>

</body>
</html>
