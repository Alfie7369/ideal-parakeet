<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Nottingham Weather | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --warning: #f59e0b;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 950px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .weather-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }
    
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    /* Current Weather Hero */
    .current-weather {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .main-info-group {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .temp-display {
      font-size: 4rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .conditions {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 0.3rem;
    }
    .weather-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    .detail-item {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .detail-item span {
      display: block;
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 0.2rem;
    }

    /* Hourly Forecast Strip */
    .hourly-container {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-top: 1rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .hourly-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      min-width: 85px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .hourly-time {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
    }
    .hourly-temp {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--text-main);
      margin-top: 0.25rem;
    }

    /* 7-Day Forecast Grid */
    .forecast-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .forecast-day {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .forecast-day h4 {
      margin: 0 0 0.25rem 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .forecast-temp {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-main);
      margin-top: 0.5rem;
    }
    .forecast-temp span {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: normal;
    }

    /* SVG Icon Styling */
    .weather-icon {
      width: 48px;
      height: 48px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .weather-icon-sm {
      width: 28px;
      height: 28px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin: 0.2rem 0;
    }

    .loading { text-align: center; color: var(--text-muted); padding: 2rem; }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Nottingham <span>Weather</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">Live Open-Meteo Meteorological Data</p>
    </div>

    <div class="weather-grid">
      <!-- Current Conditions Card -->
      <div class="card" id="current-card">
        <div class="loading">Loading current weather conditions...</div>
      </div>

      <!-- Hourly Forecast Card -->
      <div class="card">
        <h2 style="margin-top: 0; font-size: 1.3rem;">Hourly Forecast (Next 24 Hours)</h2>
        <div class="hourly-container" id="hourly-container">
          <div class="loading">Loading hourly data...</div>
        </div>
      </div>

      <!-- 7-Day Forecast Card -->
      <div class="card">
        <h2 style="margin-top: 0; font-size: 1.3rem;">7-Day Outlook</h2>
        <div class="forecast-container" id="forecast-container">
          <div class="loading">Loading forecast data...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getWeatherInfo(code) {
      switch (code) {
        case 0:
          return {
            desc: "Clear sky",
            icon: `<svg class="weather-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
            iconSm: `<svg class="weather-icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`
          };
        case 1:
        case 2:
          return {
            desc: "Partly cloudy",
            icon: `<svg class="weather-icon" viewBox="0 0 24 24"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"></path></svg>`,
            iconSm: `<svg class="weather-icon-sm" viewBox="0 0 24 24"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"></path></svg>`
          };
        case 3:
          return {
            desc: "Overcast",
            icon: `<svg class="weather-icon" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>`,
            iconSm: `<svg class="weather-icon-sm" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>`
          };
        case 45:
        case 48:
          return {
            desc: "Foggy",
            icon: `<svg class="weather-icon" viewBox="0 0 24 24"><line x1="3" y1="10" x2="21" y2="10"></line><line x1="5" y1="14" x2="19" y2="14"></line><line x1="7" y1="6" x2="17" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`,
            iconSm: `<svg class="weather-icon-sm" viewBox="0 0 24 24"><line x1="3" y1="10" x2="21" y2="10"></line><line x1="5" y1="14" x2="19" y2="14"></line><line x1="7" y1="6" x2="17" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`
          };
        case 51:
        case 53:
        case 55:
        case 61:
        case 63:
        case 80:
        case 81:
          return {
            desc: "Rain showers",
            icon: `<svg class="weather-icon" viewBox="0 0 24 24"><path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="12" y1="19" x2="12" y2="21"></line><line x1="16" y1="19" x2="16" y2="21"></line></svg>`,
            iconSm: `<svg class="weather-icon-sm" viewBox="0 0 24 24"><path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="12" y1="19" x2="12" y2="21"></line><line x1="16" y1="19" x2="16" y2="21"></line></svg>`
          };
        case 65:
        case 82:
          return {
            desc: "Heavy rain",
            icon: `<svg class="weather-icon" viewBox="0 0 24 24"><path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"></path><line x1="6" y1="18" x2="5" y2="22"></line><line x1="10" y1="18" x2="9" y2="22"></line><line x1="14" y1="18" x2="13" y2="22"></line><line x1="18" y1="18" x2="17" y2="22"></line></svg>`,
            iconSm: `<svg class="weather-icon-sm" viewBox="0 0 24 24"><path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"></path><line x1="6" y1="18" x2="5" y2="22"></line><line x1="10" y1="18" x2="9" y2="22"></line><line x1="14" y1="18" x2="13" y2="22"></line><line x1="18" y1="18" x2="17" y2="22"></line></svg>`
          };
        case 95:
        case 96:
        case 99:
          return {
            desc: "Thunderstorm",
            icon: `<svg class="weather-icon" viewBox="0 0 24 24"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"></path><polyline points="13 11 9 17 15 17 11 23"></polyline></svg>`,
            iconSm: `<svg class="weather-icon-sm" viewBox="0 0 24 24"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"></path><polyline points="13 11 9 17 15 17 11 23"></polyline></svg>`
          };
        default:
          return {
            desc: "Variable conditions",
            icon: `<svg class="weather-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`,
            iconSm: `<svg class="weather-icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`
          };
      }
    }

    function formatDayName(dateString) {
      const options = { weekday: 'short' };
      return new Date(dateString).toLocaleDateString('en-GB', options);
    }

    function formatHour(isoString) {
      const date = new Date(isoString);
      return date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    async function fetchNottinghamWeather() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.9548&longitude=-1.1581&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FLondon');
        const data = await response.json();

        // 1. Current Weather
        const current = data.current;
        const currentInfo = getWeatherInfo(current.weather_code);
        
        document.getElementById('current-card').innerHTML = `
          <div class="current-weather">
            <div class="main-info-group">
              <div>${currentInfo.icon}</div>
              <div>
                <div class="conditions">${currentInfo.desc}</div>
                <div class="temp-display">${Math.round(current.temperature_2m)}°C</div>
                <div style="color: var(--text-muted); margin-top: 0.4rem; font-size: 0.95rem;">
                  Feels like ${Math.round(current.apparent_temperature)}°C
                </div>
              </div>
            </div>
            <div style="text-align: right;">
              <div style="font-weight: 600; font-size: 1.1rem;">Nottingham</div>
              <div style="color: var(--text-muted); font-size: 0.85rem;">University Area / Beeston</div>
            </div>
          </div>
          <div class="weather-details">
            <div class="detail-item">Wind Speed <span>${current.wind_speed_10m} km/h</span></div>
            <div class="detail-item">Humidity <span>${current.relative_humidity_2m}%</span></div>
          </div>
        `;

        // 2. Hourly Forecast (Next 24 Hours starting from current hour)
        const hourly = data.hourly;
        const hourlyContainer = document.getElementById('hourly-container');
        hourlyContainer.innerHTML = '';

        const nowIndex = hourly.time.findIndex(t => new Date(t) >= new Date()) || 0;
        const endIndex = Math.min(nowIndex + 24, hourly.time.length);

        for (let i = nowIndex; i < endIndex; i++) {
          const hourTime = formatHour(hourly.time[i]);
          const temp = Math.round(hourly.temperature_2m[i]);
          const hourInfo = getWeatherInfo(hourly.weather_code[i]);

          const hourCard = document.createElement('div');
          hourCard.className = 'hourly-item';
          hourCard.innerHTML = `
            <div class="hourly-time">${hourTime}</div>
            <div>${hourInfo.iconSm}</div>
            <div class="hourly-temp">${temp}°C</div>
          `;
          hourlyContainer.appendChild(hourCard);
        }

        // 3. 7-Day Forecast
        const daily = data.daily;
        const forecastContainer = document.getElementById('forecast-container');
        forecastContainer.innerHTML = '';

        for (let i = 0; i < daily.time.length; i++) {
          const dayName = i === 0 ? 'Today' : formatDayName(daily.time[i]);
          const maxTemp = Math.round(daily.temperature_2m_max[i]);
          const minTemp = Math.round(daily.temperature_2m_min[i]);
          const dayInfo = getWeatherInfo(daily.weather_code[i]);

          const dayCard = document.createElement('div');
          dayCard.className = 'forecast-day';
          dayCard.innerHTML = `
            <h4>${dayName}</h4>
            <div>${dayInfo.iconSm}</div>
            <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; text-align: center;">${dayInfo.desc}</div>
            <div class="forecast-temp">${maxTemp}° <span style="font-weight: normal;">/ ${minTemp}°</span></div>
          `;
          forecastContainer.appendChild(dayCard);
        }

      } catch (error) {
        console.error("Failed to load weather data:", error);
        document.getElementById('current-card').innerHTML = '<div class="loading" style="color: var(--danger);">Failed to retrieve weather feed.</div>';
      }
    }

    fetchNottinghamWeather();
    setInterval(fetchNottinghamWeather, 600000);
  </script>

</body>
</html>
