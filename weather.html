<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Nottingham Weather | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --pop-blue: #60a5fa;
      --uv-warn: #fbbf24;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .card-header {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-main);
    }

    /* Current Conditions Grid */
    .current-grid {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 2rem;
    }
    .current-main {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .current-icon svg {
      width: 64px;
      height: 64px;
      stroke: var(--accent);
    }
    .current-temp {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
    }
    .current-desc {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-top: 0.25rem;
    }
    .current-location {
      text-align: right;
    }
    .current-location h2 { margin: 0; font-size: 1.25rem; }
    .current-location p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }

    /* Extended Metrics Bar */
    .metrics-bar {
      display: flex;
      gap: 2.5rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .metric {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .metric-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metric-value {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    /* Custom Horizon Icon */
    .horizon-icon {
      width: 24px;
      height: 24px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Hourly Forecast */
    .hourly-container {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .hourly-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
      background: rgba(0,0,0,0.15);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 0.5rem;
      gap: 0.5rem;
    }
    .hourly-time { font-size: 0.85rem; color: var(--text-muted); }
    .hourly-icon svg { width: 24px; height: 24px; stroke: var(--text-main); }
    .hourly-temp { font-weight: 600; font-size: 1.1rem; }
    .hourly-pop { 
      font-size: 0.75rem; 
      color: var(--pop-blue); 
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* 7-Day Outlook */
    .daily-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 1rem;
    }
    .daily-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0,0,0,0.15);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 0.5rem;
      gap: 0.5rem;
    }
    .daily-day { font-weight: 600; font-size: 0.95rem; }
    .daily-icon svg { width: 28px; height: 28px; stroke: var(--text-main); }
    .daily-desc { font-size: 0.75rem; color: var(--text-muted); text-align: center; }
    .daily-temps {
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 0.25rem;
    }
    .temp-min { color: var(--text-muted); font-weight: normal; }

    .loading { text-align: center; padding: 3rem; color: var(--text-muted); }

    @media (max-width: 600px) {
      .current-grid { flex-direction: column; gap: 1.5rem; }
      .current-location { text-align: left; }
      .metrics-bar { gap: 1.5rem; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Nottingham <span>Weather</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">Live Open-Meteo Meteorological Data</p>
    </div>

    <div id="weather-dashboard">
      <div class="loading">Fetching local telemetry...</div>
    </div>
  </div>

  <script>
    // WMO Weather interpretation codes mapping to SVG icons
    const weatherCodes = {
      0: { desc: "Clear sky", icon: '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>' },
      1: { desc: "Mainly clear", icon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>' },
      2: { desc: "Partly cloudy", icon: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>' },
      3: { desc: "Overcast", icon: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>' },
      45: { desc: "Fog", icon: '<line x1="4" y1="14" x2="20" y2="14"/><line x1="8" y1="18" x2="20" y2="18"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8" y1="6" x2="20" y2="6"/>' },
      48: { desc: "Depositing rime fog", icon: '<line x1="4" y1="14" x2="20" y2="14"/><line x1="8" y1="18" x2="20" y2="18"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8" y1="6" x2="20" y2="6"/>' },
      51: { desc: "Light drizzle", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      53: { desc: "Moderate drizzle", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      55: { desc: "Dense drizzle", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      61: { desc: "Slight rain", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      63: { desc: "Moderate rain", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      65: { desc: "Heavy rain", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      71: { desc: "Slight snow", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      73: { desc: "Moderate snow", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      75: { desc: "Heavy snow", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      77: { desc: "Snow grains", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      80: { desc: "Slight rain showers", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      81: { desc: "Moderate rain showers", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      82: { desc: "Violent rain showers", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      85: { desc: "Slight snow showers", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      86: { desc: "Heavy snow showers", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>' },
      95: { desc: "Thunderstorm", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>' },
      96: { desc: "Thunderstorm with slight hail", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>' },
      99: { desc: "Thunderstorm with heavy hail", icon: '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>' },
    };

    function getIconSvg(code) {
      const data = weatherCodes[code] || weatherCodes[0];
      return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${data.icon}</svg>`;
    }

    function getDesc(code) {
      return (weatherCodes[code] || weatherCodes[0]).desc;
    }

    function formatTime(isoString) {
      const date = new Date(isoString);
      return date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    function getDayName(isoString, isToday) {
      if (isToday) return "Today";
      const date = new Date(isoString);
      return date.toLocaleDateString('en-GB', { weekday: 'short' });
    }

    async function fetchWeather() {
      try {
        // Updated API call adding sunrise, sunset, uv_index_max, and precipitation_probability
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.9536&longitude=-1.1505&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=Europe%2FLondon');
        const data = await res.json();

        const current = data.current;
        const daily = data.daily;
        const hourly = data.hourly;
        
        // Extract daylight and UV data for today (index 0)
        const sunriseTime = formatTime(daily.sunrise[0]);
        const sunsetTime = formatTime(daily.sunset[0]);
        const uvMax = daily.uv_index_max[0];
        
        let uvColor = "var(--text-main)";
        if (uvMax > 5) uvColor = "var(--uv-warn)";

        // 1. Current Conditions HTML
        let html = `
          <div class="card">
            <div class="current-grid">
              <div class="current-main">
                <div class="current-icon">${getIconSvg(current.weather_code)}</div>
                <div>
                  <div class="current-temp">${Math.round(current.temperature_2m)}°C</div>
                  <div class="current-desc">
                    <span style="font-weight:600;">${getDesc(current.weather_code)}</span> &nbsp;|&nbsp; Feels like ${Math.round(current.apparent_temperature)}°C
                  </div>
                </div>
              </div>
              <div class="current-location">
                <h2>Nottingham</h2>
                <p>East Midlands, UK</p>
              </div>
            </div>
            
            <div class="metrics-bar">
              <div class="metric">
                <div class="metric-label">Wind Speed</div>
                <div class="metric-value">${current.wind_speed_10m} km/h</div>
              </div>
              <div class="metric">
                <div class="metric-label">Humidity</div>
                <div class="metric-value">${current.relative_humidity_2m}%</div>
              </div>
              <div class="metric">
                <div class="metric-label">Max UV Index</div>
                <div class="metric-value" style="color: ${uvColor};">${uvMax}</div>
              </div>
              <div class="metric">
                <div class="metric-label">Daylight</div>
                <div class="metric-value">
                  <svg class="horizon-icon" viewBox="0 0 24 24">
                    <path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/>
                  </svg>
                  ${sunriseTime} - ${sunsetTime}
                </div>
              </div>
            </div>
          </div>
        `;

        // 2. Hourly Forecast HTML (Find current hour index)
        const now = new Date();
        const currentHourIso = now.toISOString().slice(0, 14) + "00";
        let startIndex = hourly.time.findIndex(t => t.startsWith(currentHourIso.slice(0, 13)));
        if (startIndex === -1) startIndex = 0; // fallback

        html += `
          <div class="card">
            <div class="card-header">Hourly Forecast (Next 24 Hours)</div>
            <div class="hourly-container">
        `;

        for (let i = startIndex; i < startIndex + 24; i++) {
          if (i >= hourly.time.length) break;
          const time = formatTime(hourly.time[i]);
          const temp = Math.round(hourly.temperature_2m[i]);
          const code = hourly.weather_code[i];
          const pop = hourly.precipitation_probability[i];
          
          let popHtml = '';
          if (pop > 0) {
            popHtml = `
              <div class="hourly-pop">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:10px; height:10px;"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                ${pop}%
              </div>
            `;
          } else {
            popHtml = `<div class="hourly-pop" style="color: transparent;">0%</div>`; // Placeholder for alignment
          }

          html += `
            <div class="hourly-item">
              <div class="hourly-time">${time}</div>
              <div class="hourly-icon">${getIconSvg(code)}</div>
              <div class="hourly-temp">${temp}°C</div>
              ${popHtml}
            </div>
          `;
        }
        html += `</div></div>`;

        // 3. 7-Day Outlook HTML
        html += `
          <div class="card">
            <div class="card-header">7-Day Outlook</div>
            <div class="daily-grid">
        `;

        for (let i = 0; i < daily.time.length; i++) {
          const dayName = getDayName(daily.time[i], i === 0);
          const maxT = Math.round(daily.temperature_2m_max[i]);
          const minT = Math.round(daily.temperature_2m_min[i]);
          const code = daily.weather_code[i];

          html += `
            <div class="daily-item">
              <div class="daily-day">${dayName}</div>
              <div class="daily-icon">${getIconSvg(code)}</div>
              <div class="daily-desc">${getDesc(code)}</div>
              <div class="daily-temps">${maxT}° <span class="temp-min">/ ${minT}°</span></div>
            </div>
          `;
        }
        html += `</div></div>`;

        document.getElementById('weather-dashboard').innerHTML = html;

      } catch (err) {
        console.error(err);
        document.getElementById('weather-dashboard').innerHTML = `<div class="loading" style="color: #ef4444;">Failed to fetch meteorological data.</div>`;
      }
    }

    fetchWeather();
    setInterval(fetchWeather, 900000); // Refresh every 15 minutes
  </script>
</body>
</html>
