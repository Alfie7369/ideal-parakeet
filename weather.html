<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Nottingham Weather | Hawkes House</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    a.back-link:hover { color: var(--accent); }
    .header h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; }
    .header h1 span { color: var(--accent); }
    
    .weather-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }
    
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    /* Current Weather Hero */
    .current-weather {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .temp-display {
      font-size: 4rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .conditions {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    .weather-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    .detail-item {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .detail-item span {
      display: block;
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 0.2rem;
    }

    /* Forecast Row */
    .forecast-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .forecast-day {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .forecast-day h4 {
      margin: 0 0 0.5rem 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .forecast-temp {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--text-main);
      margin-top: 0.5rem;
    }
    .forecast-temp span {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: normal;
    }

    .loading { text-align: center; color: var(--text-muted); padding: 2rem; }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
      <h1>Nottingham <span>Weather</span></h1>
      <p style="color: var(--text-muted); margin-top:0;">Live Open-Meteo Meteorological Data</p>
    </div>

    <div class="weather-grid">
      <!-- Current Conditions Card -->
      <div class="card" id="current-card">
        <div class="loading">Loading current weather conditions...</div>
      </div>

      <!-- 7-Day Forecast Card -->
      <div class="card">
        <h2 style="margin-top: 0; font-size: 1.3rem;">7-Day Outlook</h2>
        <div class="forecast-container" id="forecast-container">
          <div class="loading">Loading forecast data...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // WMO Weather interpretation codes (Open-Meteo standard standards)
    function getWeatherDescription(code) {
      const descriptions = {
        0: "Clear sky",
        1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
        45: "Foggy", 48: "Depositing rime fog",
        51: "Light drizzle", 53: "Moderate drizzle", 55: "Dense drizzle",
        61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
        71: "Slight snow fall", 73: "Moderate snow fall", 75: "Heavy snow fall",
        77: "Snow grains",
        80: "Slight rain showers", 81: "Moderate rain showers", 82: "Violent rain showers",
        95: "Thunderstorm", 96: "Thunderstorm with slight hail", 99: "Thunderstorm with heavy hail"
      };
      return descriptions[code] || "Variable conditions";
    }

    function formatDayName(dateString) {
      const options = { weekday: 'short' };
      return new Date(dateString).toLocaleDateString('en-GB', options);
    }

    async function fetchNottinghamWeather() {
      try {
        // Nottingham coordinates: ~52.9548° N, 1.1581° W
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.9548&longitude=-1.1581&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FLondon');
        const data = await response.json();

        // 1. Render Current Weather
        const current = data.current;
        const currentWeatherDesc = getWeatherDescription(current.weather_code);
        
        document.getElementById('current-card').innerHTML = `
          <div class="current-weather">
            <div>
              <div class="conditions">${currentWeatherDesc}</div>
              <div class="temp-display">${Math.round(current.temperature_2m)}°C</div>
              <div style="color: var(--text-muted); margin-top: 0.4rem; font-size: 0.95rem;">
                Feels like ${Math.round(current.apparent_temperature)}°C
              </div>
            </div>
            <div style="text-align: right;">
              <span style="font-size: 2.5rem;">📍</span>
              <div style="font-weight: 600; font-size: 1.1rem;">Nottingham</div>
              <div style="color: var(--text-muted); font-size: 0.85rem;">University Area / Beeston</div>
            </div>
          </div>
          <div class="weather-details">
            <div class="detail-item">Wind Speed <span>${current.wind_speed_10m} km/h</span></div>
            <div class="detail-item">Humidity <span>${current.relative_humidity_2m}%</span></div>
          </div>
        `;

        // 2. Render 7-Day Forecast
        const daily = data.daily;
        const forecastContainer = document.getElementById('forecast-container');
        forecastContainer.innerHTML = '';

        for (let i = 0; i < daily.time.length; i++) {
          const dayName = i === 0 ? 'Today' : formatDayName(daily.time[i]);
          const maxTemp = Math.round(daily.temperature_2m_max[i]);
          const minTemp = Math.round(daily.temperature_2m_min[i]);
          const codeDesc = getWeatherDescription(daily.weather_code[i]);

          const dayCard = document.createElement('div');
          dayCard.className = 'forecast-day';
          dayCard.innerHTML = `
            <h4>${dayName}</h4>
            <div style="font-size: 0.8rem; color: var(--accent); min-height: 2.4em; display: flex; align-items: center; justify-content: center;">${codeDesc}</div>
            <div class="forecast-temp">${maxTemp}° <span>/ ${minTemp}°</span></div>
          `;
          forecastContainer.appendChild(dayCard);
        }

      } catch (error) {
        console.error("Failed to load weather data:", error);
        document.getElementById('current-card').innerHTML = '<div class="loading" style="color: var(--danger);">Failed to retrieve weather feed.</div>';
      }
    }

    fetchNottinghamWeather();
    // Refresh weather data every 10 minutes
    setInterval(fetchNottinghamWeather, 600000);
  </script>

</body>
</html>
